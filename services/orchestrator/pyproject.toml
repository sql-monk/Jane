[project]
name = "jane-orchestrator"
version = "0.1.0"
description = "Jane orchestrator: sources, tasks, stage DAGs, PostgreSQL work queue with leases, runs, schedules, connections registry and limits."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jane-kit",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.scripts]
jane-orchestrator = "jane_orchestrator.__main__:main"

[tool.uv.sources]
jane-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_orchestrator"]
