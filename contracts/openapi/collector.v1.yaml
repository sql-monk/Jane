openapi: 3.1.0
info:
  title: Jane Collector API
  version: 1.0.0
  description: |
    Спільний контракт колекторів (Web Collector — WP-02/03, Telegram Collector — WP-04).
    Колектор працює автономно: сторонній застосунок може отримати матеріали без оркестратора,
    екстрактора чи сервісу збереження (ТЗ §4, критерій 1).

    Потік матеріалів — **pull із курсором і backpressure**: `POST /v1/collections` запускає збір
    (202 + Job), споживач читає `GET /v1/collections/{id}/materials?after=<cursor>`. Запит з
    `after=C` підтверджує всі матеріали до C включно; непідтверджені матеріали видаються повторно
    (at-least-once, споживач дедуплікує за `observation_id`). Якщо непідтверджених більше за
    `limits.queue.max_unacked_materials`, колектор призупиняє обхід. Стан обходу (черга,
    дедуплікація, курсори Telegram) зберігається в сховищі колектора, тож після рестарту збір
    продовжується.

    Керовані підключення (обліковий запис Telegram, HTTP-автентифікація сайту) — ті самі операції
    `/v1/connections`, що й у спільному протоколі обробника (`common.yaml#/components/pathItems/Connection*`):
    оркестратор синхронізує визначення без секретів, колектор розв'язує `secret_refs` у своєму середовищі.
    Конвенція `params` для `kind=http` (Web Collector): `auth_scheme` = `bearer` (`secret_refs.token` →
    `Authorization: Bearer …`), `basic` (`secret_refs.username` і `secret_refs.password`) або `header`
    (`params.header_name` — ім'я заголовка, крім `Host`, `Content-Length`, `Transfer-Encoding`;
    `secret_refs.value` — значення). Облікові дані йдуть лише на origin зі списку, дозволеного оператором
    колектора, і не переносяться переадресацією на інший origin чи з HTTPS на HTTP. Для `kind=telegram_account`:
    `params.api_id`, `secret_refs.api_hash`, `secret_refs.session`.

    Кілька екземплярів колектора можуть ділити одне сховище стану (той самий вузол, спільний каталог). Будь-яка
    операція, що звертається до сховища, може отримати `503 service_unavailable` (`retryable: true`,
    `Retry-After`), якщо інший екземпляр тримає блокування сховища довше за налаштований час очікування
    колектора; запит можна повторити без змін.
  license:
    name: Proprietary
    identifier: LicenseRef-Jane
servers:
  - url: http://localhost:8101
    description: web-collector (dev)
  - url: http://localhost:8102
    description: telegram-collector (dev)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: fetch
  - name: collections
  - name: rules
  - name: state
  - name: connections
  - name: jobs
paths:
  /v1/health:
    $ref: 'common.yaml#/components/pathItems/Health'
  /v1/info:
    $ref: 'common.yaml#/components/pathItems/Info'
  /v1/fetches:
    post:
      x-jane-scope: collector:run
      operationId: fetchMaterial
      summary: Синхронно отримати один матеріал
      description: |
        Коротка операція: один URL або одне повідомлення. Перевіряє scope й robots, якщо передано
        правила. Кожен виклик — нове спостереження (новий `observation_id`), тому ключ
        ідемпотентності не потрібен. Якщо джерело підтвердило, що матеріалу немає (сайт відповів
        HTTP 404 або 410; повідомлення Telegram не існує чи видалене), — `404 not_found`; інші
        помилки джерела — `502 source_unavailable`.
      tags: [fetch]
      x-jane-no-idempotency-key: read-only for Jane state; every call is a new observation by design
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchRequest'
            examples:
              web:
                value:
                  source_kind: web
                  source_id: shop-example
                  url: https://shop.example.test/product/a-100
                  rules_ref:
                    package_id: shop-example.web-rules
                    version: 1.0.0
                  content_delivery: auto
              telegram:
                value:
                  source_kind: telegram
                  telegram:
                    channel_username: city_events_example
                    message_id: 4521
      responses:
        '200':
          description: Матеріал із метаданими.
          content:
            application/json:
              schema:
                $ref: '../schemas/material.schema.json'
              examples:
                web:
                  $ref: '../examples/openapi/material-web.json'
                blob:
                  $ref: '../examples/openapi/material-web-blob.json'
                telegram:
                  $ref: '../examples/openapi/material-telegram.json'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          description: Заборонено robots.txt або політикою доступу (`access_denied_by_policy`).
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                robots:
                  value:
                    type: urn:jane:problem:access_denied_by_policy
                    title: Access denied by policy
                    status: 403
                    code: access_denied_by_policy
                    detail: disallowed by robots.txt for user-agent JaneBot
        '404':
          description: |
            Джерело підтвердило, що матеріалу немає (`not_found`, `retryable: false`): web — сайт відповів
            HTTP 404 або 410 (`details.http_status`); Telegram — повідомлення не існує або видалене
            (`details.reason: message_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                web:
                  value:
                    type: urn:jane:problem:not_found
                    title: Not found
                    status: 404
                    code: not_found
                    retryable: false
                    detail: source returned HTTP 404
                    details:
                      http_status: 404
                telegram:
                  value:
                    type: urn:jane:problem:not_found
                    title: Not found
                    status: 404
                    code: not_found
                    retryable: false
                    detail: message 4521 not found in city_events_example
                    details:
                      reason: message_not_found
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '502':
          description: |
            Джерело недоступне або повернуло помилку (`source_unavailable`). Web: `details.http_status` —
            статус відповіді сайту (крім 404/410, див. 404) або останньої спроби після повторів. Telegram:
            `details.reason` — `channel_unavailable` (канал не знайдено, приватний чи без доступу) або
            `account_unauthorized` (сесію відхилено); для них `retryable: false`, бо повтор нічого не змінить.
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                upstream:
                  value:
                    type: urn:jane:problem:source_unavailable
                    title: Source unavailable
                    status: 502
                    code: source_unavailable
                    retryable: true
                    details:
                      http_status: 503
                channel:
                  value:
                    type: urn:jane:problem:source_unavailable
                    title: Source unavailable
                    status: 502
                    code: source_unavailable
                    retryable: false
                    details:
                      reason: channel_unavailable
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/collections:
    post:
      x-jane-scope: collector:run
      operationId: startCollection
      summary: Запустити збір (асинхронно)
      tags: [collections]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
            examples:
              webFull:
                value:
                  source_kind: web
                  source_id: shop-example
                  rules_ref:
                    package_id: shop-example.web-rules
                    version: 1.0.0
                  mode: full
                  limits:
                    crawl:
                      max_pages_per_run: 20000
                    queue:
                      max_unacked_materials: 500
              webExplicitUrls:
                value:
                  source_kind: web
                  source_id: shop-example
                  rules_ref:
                    package_id: shop-example.web-rules
                    version: 1.0.0
                  urls:
                    - https://shop.example.test/product/a-100
                    - https://shop.example.test/product/b-200
              telegramIncremental:
                value:
                  source_kind: telegram
                  source_id: news-tg
                  rules:
                    collector: telegram
                    channels:
                      - username: city_events_example
                    updates:
                      new_messages: true
                      edits: true
                    account_connection_id: tg-main
                  mode: incremental
                  state_key: news-tg
      responses:
        '202':
          $ref: 'common.yaml#/components/responses/JobAccepted'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/collections/{collection_id}:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      x-jane-scope: collector:read
      operationId: getCollection
      summary: Стан і статистика збору
      tags: [collections]
      responses:
        '200':
          description: Стан збору.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              examples:
                running:
                  $ref: '#/components/examples/CollectionRunning'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/collections/{collection_id}/materials:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      x-jane-scope: collector:read
      operationId: listCollectionMaterials
      summary: Забрати матеріали після курсора (і підтвердити попередні)
      description: |
        `after` — курсор останнього обробленого матеріалу; усі матеріали до нього включно
        вважаються підтвердженими й більше не видаються. Без `after` — від першого
        непідтвердженого. `wait_ms` — long-poll: чекати нові матеріали до вказаного часу.
        `end_of_stream: true` — збір завершено й усі матеріали видано.
      tags: [collections]
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
        - $ref: 'common.yaml#/components/parameters/Limit'
        - name: wait_ms
          in: query
          required: false
          description: Long-poll до цього часу (обрізається до максимуму сервісу).
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Сторінка матеріалів.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialPage'
              examples:
                page:
                  $ref: '#/components/examples/MaterialPage'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '410':
          description: Збір видалено після `job_retention_seconds`.
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                gone:
                  value:
                    type: urn:jane:problem:not_found
                    title: Collection expired
                    status: 410
                    code: not_found
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/collections/{collection_id}/errors:
    parameters:
      - $ref: '#/components/parameters/CollectionId'
    get:
      x-jane-scope: collector:read
      operationId: listCollectionErrors
      summary: Помилки й пропуски окремих URL/повідомлень
      tags: [collections]
      parameters:
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка помилок.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchErrorPage'
              examples:
                errors:
                  value:
                    items:
                      - url: https://shop.example.test/private/x
                        code: access_denied_by_policy
                        message: disallowed by robots.txt
                        at: '2026-09-27T10:00:07Z'
                      - url: https://shop.example.test/product/z-9
                        code: source_unavailable
                        http_status: 500
                        attempts: 3
                        message: HTTP 500
                        at: '2026-09-27T10:01:10Z'
                    next_cursor: null
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/rules/validations:
    post:
      x-jane-scope: [collector:read, collector:run]
      operationId: validateRules
      summary: Перевірити правила колектора без запуску
      tags: [rules]
      x-jane-no-idempotency-key: pure validation without side effects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/collector-rules.schema.json'
            examples:
              shop:
                $ref: '../examples/openapi/rules-web-shop.json'
              news:
                $ref: '../examples/openapi/rules-web-news.json'
              telegram:
                $ref: '../examples/openapi/rules-telegram.json'
      responses:
        '200':
          description: Результат перевірки (невалідні правила — теж 200 з valid=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesValidation'
              examples:
                ok:
                  value:
                    valid: true
                    errors: []
                    warnings:
                      - pointer: /strategies/1
                        message: recursive strategy without max_depth inherits limits.crawl.max_depth
                    supported: true
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
  /v1/states/{state_key}:
    parameters:
      - name: state_key
        in: path
        required: true
        schema:
          $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
    get:
      x-jane-scope: collector:read
      operationId: getCollectorState
      summary: Стан обходу/курсори, збережені колектором
      tags: [state]
      responses:
        '200':
          description: Підсумок збереженого стану.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorState'
              examples:
                web:
                  value:
                    state_key: shop-example
                    collector: web
                    updated_at: '2026-09-27T12:00:00Z'
                    known_urls: 18234
                    frontier_size: 0
                    cursors: {}
                telegram:
                  value:
                    state_key: news-tg
                    collector: telegram
                    updated_at: '2026-09-27T12:30:00Z'
                    cursors:
                      '-1001234567890':
                        last_message_id: 4530
                        last_edit_date: '2026-09-27T12:10:00Z'
                        pts: 9112
                        username: city_events_example
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
    delete:
      x-jane-scope: collector:run
      operationId: resetCollectorState
      summary: Скинути збережений стан (наступний збір — з нуля)
      tags: [state]
      responses:
        '204':
          description: Стан видалено.
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/connections:
    get:
      x-jane-scope: [connections:write, collector:read]
      operationId: listConnections
      summary: Підключення, відомі цьому виконавцю
      tags: [connections]
      parameters:
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка підключень (без значень секретів).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/connection.schema.json#/$defs/ConnectionList'
              examples:
                list:
                  $ref: 'common.yaml#/components/pathItems/Connections/get/responses/200/content/application~1json/examples/list'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/connections/{connection_id}:
    parameters:
      - $ref: 'common.yaml#/components/parameters/ConnectionId'
    get:
      x-jane-scope: [connections:write, collector:read]
      operationId: getConnection
      summary: Прочитати підключення
      tags: [connections]
      responses:
        '200':
          description: Підключення.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/common/connection.schema.json'
              examples:
                pg:
                  $ref: '../examples/openapi/connection-pg.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
    put:
      x-jane-scope: connections:write
      operationId: putConnection
      summary: Створити або замінити підключення (секрети — лише посиланнями)
      description: |
        Викликає оркестратор, синхронізуючи реєстр підключень, або адміністратор автономного
        виконавця. Значення, схожі на секрети, у `params` відхиляються (`secret_detected`).
      tags: [connections]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/common/connection.schema.json'
            examples:
              pg:
                $ref: '../examples/openapi/connection-pg.json'
              llm:
                $ref: '../examples/openapi/connection-llm.json'
      responses:
        '200':
          description: Підключення замінено.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/common/connection.schema.json'
              examples:
                pg:
                  $ref: '../examples/openapi/connection-pg.json'
        '201':
          description: Підключення створено.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/common/connection.schema.json'
              examples:
                pg:
                  $ref: '../examples/openapi/connection-pg.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '501':
          description: Виконавець не використовує підключень (`not_implemented`).
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                notImplemented:
                  value:
                    type: urn:jane:problem:not_implemented
                    title: Not implemented
                    status: 501
                    code: not_implemented
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
    delete:
      x-jane-scope: connections:write
      operationId: deleteConnection
      summary: Видалити підключення
      tags: [connections]
      responses:
        '204':
          description: Видалено.
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/connections/{connection_id}/test:
    parameters:
      - $ref: 'common.yaml#/components/parameters/ConnectionId'
    post:
      x-jane-scope: connections:write
      operationId: testConnection
      summary: Перевірити підключення й розв'язання секретів
      tags: [connections]
      x-jane-no-idempotency-key: read-only check without side effects
      responses:
        '200':
          description: Результат перевірки (невдала перевірка — теж 200 з ok=false).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/connection.schema.json#/$defs/ConnectionTestResult'
              examples:
                ok:
                  value:
                    ok: true
                    checked_at: '2026-09-27T10:00:00Z'
                    latency_ms: 12
                    secrets_resolved:
                      username: true
                      password: true
                missingSecret:
                  value:
                    ok: false
                    checked_at: '2026-09-27T10:00:00Z'
                    secrets_resolved:
                      username: true
                      password: false
                    message: environment variable RESULTS_PG_PASSWORD is not set
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/jobs/{job_id}:
    parameters:
      - $ref: 'common.yaml#/components/parameters/JobId'
    get:
      x-jane-scope: collector:read
      operationId: getJob
      summary: Стан, прогрес і результат тривалої операції
      tags: [jobs]
      responses:
        '200':
          description: Поточний стан job.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Job'
              examples:
                running:
                  $ref: 'common.yaml#/components/examples/JobRunning'
                failed:
                  $ref: 'common.yaml#/components/examples/JobFailed'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
  /v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: 'common.yaml#/components/parameters/JobId'
    post:
      x-jane-scope: collector:run
      operationId: cancelJob
      summary: Запит на скасування job (ідемпотентний)
      x-jane-no-idempotency-key: cancellation is idempotent by nature
      description: |
        202 — скасування прийнято, job переходить у `cancelling`, далі в `cancelled`.
        200 — job уже в термінальному стані; повертається як є, без змін.
        Повторний виклик безпечний, тому Idempotency-Key не потрібен.
      tags: [jobs]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/JobCancelRequest'
            examples:
              reason:
                value:
                  reason: wrong scope
      responses:
        '200':
          description: Job уже завершено; стан не змінено.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Job'
              examples:
                failed:
                  $ref: 'common.yaml#/components/examples/JobFailed'
        '202':
          description: Скасування прийнято.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Job'
              examples:
                cancelling:
                  $ref: 'common.yaml#/components/examples/JobCancelling'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CollectionId:
      name: collection_id
      in: path
      required: true
      description: Дорівнює job_id, повернутому POST /v1/collections.
      schema:
        $ref: '../schemas/common/defs.schema.json#/$defs/Id'
  schemas:
    ContentDelivery:
      type: string
      enum: [auto, inline, blob]
      default: auto
      description: auto — inline до limits.transfer.inline_max_bytes, інакше blob.
    FetchRequest:
      type: object
      additionalProperties: false
      required: [source_kind]
      properties:
        source_kind:
          $ref: '../schemas/common/defs.schema.json#/$defs/SourceKind'
        source_id:
          $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
        url:
          type: string
          format: uri
        telegram:
          type: object
          additionalProperties: false
          required: [message_id]
          properties:
            channel_username:
              type: string
            channel_id:
              type: string
            message_id:
              type: integer
        rules:
          $ref: '../schemas/collector-rules.schema.json'
        rules_ref:
          $ref: '../schemas/common/package-ref.schema.json'
        content_delivery:
          $ref: '#/components/schemas/ContentDelivery'
        limits:
          $ref: '../schemas/common/limits.schema.json'
    CollectionRequest:
      type: object
      additionalProperties: false
      required: [source_kind]
      description: Потрібні rules (inline, автономний режим) або rules_ref (версія з репозиторію).
      properties:
        source_kind:
          $ref: '../schemas/common/defs.schema.json#/$defs/SourceKind'
        source_id:
          $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
        rules:
          $ref: '../schemas/collector-rules.schema.json'
        rules_ref:
          $ref: '../schemas/common/package-ref.schema.json'
        urls:
          type: array
          description: Явний перелік — лише ці URL, без рекурсії (у межах scope правил).
          items:
            type: string
            format: uri
        mode:
          type: string
          enum: [full, incremental]
          default: full
        state_key:
          description: Простір збереженого стану (черга, дедуплікація, курсори). За замовчуванням source_id.
          $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
        content_delivery:
          $ref: '#/components/schemas/ContentDelivery'
        limits:
          $ref: '../schemas/common/limits.schema.json'
        trace:
          $ref: '../schemas/common/defs.schema.json#/$defs/TraceContext'
        labels:
          $ref: '../schemas/common/defs.schema.json#/$defs/Labels'
      anyOf:
        - required: [rules]
        - required: [rules_ref]
    CollectionStats:
      type: object
      properties:
        discovered:
          type: integer
          minimum: 0
        fetched:
          type: integer
          minimum: 0
        emitted:
          type: integer
          minimum: 0
        acknowledged:
          type: integer
          minimum: 0
        unacked:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        skipped_out_of_scope:
          type: integer
          minimum: 0
        skipped_robots:
          type: integer
          minimum: 0
        not_modified:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
        frontier_size:
          type: integer
          minimum: 0
        bytes_fetched:
          type: integer
          minimum: 0
        by_strategy:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    Collection:
      type: object
      required: [collection_id, status, source_kind, created_at, stats]
      properties:
        collection_id:
          $ref: '../schemas/common/defs.schema.json#/$defs/Id'
        status:
          $ref: '../schemas/common/job.schema.json#/$defs/JobStatus'
        paused_by_backpressure:
          type: boolean
        source_kind:
          $ref: '../schemas/common/defs.schema.json#/$defs/SourceKind'
        source_id:
          $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
        rules:
          $ref: '../schemas/common/package-ref.schema.json'
        mode:
          type: string
          enum: [full, incremental]
        state_key:
          type: string
        created_at:
          $ref: '../schemas/common/defs.schema.json#/$defs/Timestamp'
        finished_at:
          $ref: '../schemas/common/defs.schema.json#/$defs/Timestamp'
        stats:
          $ref: '#/components/schemas/CollectionStats'
        effective_limits:
          $ref: '../schemas/common/limits.schema.json'
    MaterialPage:
      type: object
      required: [items, next_cursor, end_of_stream, collection_status]
      properties:
        items:
          type: array
          items:
            $ref: '../schemas/material.schema.json'
        next_cursor:
          description: Курсор останнього елемента сторінки; передайте як after у наступному запиті.
          $ref: '../schemas/common/page.schema.json#/$defs/NextCursor'
        end_of_stream:
          type: boolean
        collection_status:
          $ref: '../schemas/common/job.schema.json#/$defs/JobStatus'
    FetchError:
      type: object
      required: [code, message, at]
      properties:
        url:
          type: string
        telegram_message:
          type: string
        code:
          type: string
        http_status:
          type: integer
        attempts:
          type: integer
          minimum: 1
        message:
          type: string
        at:
          $ref: '../schemas/common/defs.schema.json#/$defs/Timestamp'
    FetchErrorPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FetchError'
        next_cursor:
          $ref: '../schemas/common/page.schema.json#/$defs/NextCursor'
    RulesValidation:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        supported:
          type: boolean
          description: |
            false — правила валідні за схемою, але ця реалізація колектора не виконує стратегію або її опцію
            (наприклад llm_explore, незареєстрована стратегія чи правила іншого колектора). Попередження містять
            точні JSON Pointer (`code: unsupported_strategy`); запуск збору з такими правилами повертає 422
            validation_failed. Опції api_feed `method: POST` і `emit_items_as_materials: true` Web Collector
            виконує з WP-16.
        errors:
          type: array
          items:
            $ref: '../schemas/common/problem.schema.json#/$defs/FieldError'
        warnings:
          type: array
          items:
            $ref: '../schemas/common/problem.schema.json#/$defs/FieldError'
    CollectorState:
      type: object
      required: [state_key, collector, updated_at]
      properties:
        state_key:
          type: string
        collector:
          type: string
        updated_at:
          $ref: '../schemas/common/defs.schema.json#/$defs/Timestamp'
        known_urls:
          type: integer
          minimum: 0
        frontier_size:
          type: integer
          minimum: 0
        cursors:
          type: object
          description: |
            Курсори, збережені для `state_key` (читаються наступним `mode: incremental`).
            Telegram — ключ `channel_id` (`-100…`), значення: `last_message_id` (найбільший виданий id),
            `last_edit_date` (найпізніший виданий `edit_date`, RFC 3339), `pts` (стан оновлень каналу, з якого
            наступний збір читає `getChannelDifference`; відсутній, поки збір каналу не дочитав історію до кінця —
            тоді наступний збір дочитує історію після `last_message_id`), `username`.
            Web — ключ `strategy_id`, значення: непорожній `snapshot()` стратегії (стан і діагностичні лічильники,
            наприклад `stats`); стан черги й історії URL не показується, лише `known_urls` і `frontier_size`.
          additionalProperties:
            type: object
  examples:
    CollectionRunning:
      summary: Збір іде, пригальмовано backpressure
      value:
