[project]
name = "jane-assistant"
version = "0.1.0"
description = "Assistant of the Jane platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jane-kit",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
jane-assistant = "jane_assistant.__main__:main"

[tool.uv.sources]
jane-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_assistant"]
