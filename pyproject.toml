# Jane monorepo: virtual uv workspace root (no package of its own).
# Members are discovered by glob, so wave-1 WPs never need to edit this file:
# a new directory services/<name>/ with a pyproject.toml becomes a member automatically.

[tool.uv.workspace]
members = [
    "contracts/python",
    "libs/*",
    "services/*",
    "services/storage/adapters/*",
    "templates/service",
    "tests/fixtures/testsite",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "openapi-spec-validator>=0.7",
    "datamodel-code-generator>=0.26",
    "httpx>=0.27",
]
# Drivers for the dev-stack smoke test (infra/tests) and service integration tests.
integration = [
    "psycopg[binary]>=3.2",
    "pymssql>=2.3",
    "pymongo>=4.10",
    "boto3>=1.35",
]

[tool.uv]
default-groups = ["dev", "integration"]

[tool.uv.sources]
jane-contracts = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [
    "**/_generated/**",
    "web/**",
    "node_modules",
    # WP-00 owns contracts/; its linter (contracts/tools/check_contracts.py, run by `just contract`) is authoritative.
    "contracts",
    # Skills, agents and docs of other owners (ruff also formats Python blocks inside Markdown).
    ".claude/skills",
    ".claude/agents",
    "docs",
    # Coordinator-owned hooks are not formatted/linted by WP tooling.
    ".claude/hooks/jane_wp.py",
    ".claude/hooks/guard_paths.py",
    ".claude/hooks/guard_bash.py",
    ".claude/hooks/check_report.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "PT", "N"]
ignore = [
    "E501",                       # line length is the formatter's job
    "N818",                       # JaneError/NotFound... map to problem codes, no "Error" suffix needed
    "RUF001", "RUF002", "RUF003", # Ukrainian text in strings/comments is intentional
    "S101",                       # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N802", "PT018"]
"scripts/**" = ["S603", "S607"]
".claude/hooks/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["jane_*"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["/_generated/", "^contracts/(?!python/)"]  # Protocols are typed; other contracts use WP-00 tools.

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "openapi_spec_validator.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
# importlib mode: every package keeps its own `tests/` directory without name clashes.
addopts = "--import-mode=importlib -ra --strict-markers --strict-config"
testpaths = ["libs", "services", "templates/service", "tests/fixtures", "scripts/tests", "infra/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: checks an API against its OpenAPI contract (CI stage `contract`)",
    "integration: needs the dev stack (`just up`) or other external processes",
    "isolation: sandbox isolation tests, Linux only (WP-06, CI job `isolation`)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
