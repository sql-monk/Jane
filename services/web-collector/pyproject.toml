[project]
name = "jane-web-collector"
version = "0.1.0"
description = "Web Collector of the Jane platform: crawl core, discovery strategy registry and the collector.v1 API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jane-kit",
    "jane-contracts",
    "httpx>=0.27",
    "lxml>=5.3",
    "cssselect>=1.2",
]

[project.scripts]
jane-web-collector = "jane_web_collector.__main__:main"

[dependency-groups]
dev = [
    "jane-testsite",
    "psutil>=6.0",
]

[tool.uv.sources]
jane-kit = { workspace = true }
jane-testsite = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_web_collector"]
