# Jane e2e overlay (WP-13): test configuration for application services in infra/compose.yaml.
#
#   docker compose -f infra/compose.yaml -f tests/e2e/compose.e2e.yaml -p <unique> up -d --wait <services>
#
# Used by tests/e2e (jane_e2e.stack.E2EStack), which sets a unique project, generated credentials and:
#   COMPOSE_PROFILES        application services present in this checkout (profile name == service name);
#   JANE_E2E_SANDBOX_IMAGE  image of runtime profile python-extractor@1 (built by `jane-handler-runtime build-image`);
#   JANE_DOCKER_SOCKET      docker API socket for handler-runtime sandboxes (default /var/run/docker.sock);
#   JANE_DOCKER_GID         group of that socket inside containers (0 on Docker Desktop, docker gid on Linux).
#
# NOTE: with several -f files compose resolves relative paths against the FIRST file (infra/), hence `..`.
# A service joins the base compose when its WP is merged into main; until then tests skip with the reason.
# Host ports are chosen by Docker (127.0.0.1 only); `docker compose port` / E2EStack.url() read them.

x-e2e-health: &e2e-health
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  storage:
    environment:
      JANE_STORAGE_CONNECTION_HOST_ALLOWLIST: '["postgres:5432", "sqlserver:1433", "mongodb:27017", "minio:9000", "s3:8333"]'
      # R-04 while a write is running: material content is a blob whose download_url is a gate of the
      # package-host stand-in (tests/e2e/jane_e2e/active.py); downloads stay disabled for every other host.
      JANE_STORAGE_DOWNLOAD_HOST_ALLOWLIST: '["package-host:8080"]'
      # Criterion 9 opts into the real registry for a task pinned to a storage fork.
      JANE_STORAGE_REGISTRY_URL: ${JANE_E2E_STORAGE_REGISTRY_URL:-}
      # Secret values only through secret_refs (ADR-0006); names use the JANE_SECRET_ prefix.
      JANE_SECRET_E2E_STORAGE_RESULTS_USER: jane_storage_results
      JANE_SECRET_E2E_STORAGE_RESULTS_PASSWORD: ${JANE_PG_STORAGE_RESULTS_PASSWORD:?set by tests/e2e}
      JANE_SECRET_E2E_SQLSERVER_USER: sa
      JANE_SECRET_E2E_SQLSERVER_PASSWORD: ${JANE_MSSQL_SA_PASSWORD:?set by tests/e2e}
      JANE_SECRET_E2E_MONGO_USER: ${JANE_MONGO_USER:?set by tests/e2e}
      JANE_SECRET_E2E_MONGO_PASSWORD: ${JANE_MONGO_PASSWORD:?set by tests/e2e}
      JANE_SECRET_E2E_MINIO_ACCESS_KEY: ${JANE_MINIO_ACCESS_KEY:?set by tests/e2e}
      JANE_SECRET_E2E_MINIO_SECRET_KEY: ${JANE_MINIO_SECRET_KEY:?set by tests/e2e}
      JANE_SECRET_E2E_S3_ACCESS_KEY: ${JANE_S3_ACCESS_KEY:?set by tests/e2e}
      JANE_SECRET_E2E_S3_SECRET_KEY: ${JANE_S3_SECRET_KEY:?set by tests/e2e}

  handler-runtime:
    volumes:
      # Stored RAW of the files adapter is referenced as file:///var/lib/jane/storage/... (persistent ContentRef);
      # ADR-0004 allows file:// only on one node with a shared volume, so the runtime reads it read-only
      # (reprocessing of stored RAW, S-M2-07).
      - storage-data:/var/lib/jane/storage:ro
    environment:
      JANE_HANDLER_RUNTIME_BLOB_ROOTS: '["/var/lib/jane/storage"]'
      JANE_HANDLER_RUNTIME_PROFILE_IMAGES: '{"python-extractor@1": "${JANE_E2E_SANDBOX_IMAGE:?set by tests/e2e}"}'
      JANE_HANDLER_RUNTIME_SANDBOX_LABELS: '{"io.jane.e2e-project": "${JANE_E2E_PROJECT:-jane-e2e}"}'
      # Archives of orchestrated stages (no package_archive) come from the real registry (WP-05).
      JANE_HANDLER_RUNTIME_REGISTRY_URL: ${JANE_E2E_RUNTIME_REGISTRY_URL:-http://registry:8000}
      # When an in-progress delivery key of a killed runtime may be taken over. The default is the service's
      # own (15 min); R-07 shortens it for its stack so that calls cut by a runtime kill finish in the e2e budget.
      JANE_HANDLER_RUNTIME_LIMITS__STATE__IN_PROGRESS_LEASE_MS: ${JANE_E2E_RUNTIME_IN_PROGRESS_LEASE_MS:-900000}

  llm:
    environment:
      # SUBSTITUTE of the external LLM: deterministic provider `fake` (real Anthropic - not verified).
      JANE_LLM_SEED_FILE: /cfg/llm-seed.yaml
      # S-M2-06 classifies 54 name-only and 16 hinted pages, then S-M2-07 improves a package in one
      # shared module stack. The production default of 60 calls/minute rejects the second onboarding.
      JANE_LLM_LIMITS__LLM__MAX_REQUESTS_PER_MINUTE: ${JANE_E2E_LLM_MAX_REQUESTS_PER_MINUTE:-120}
      # LLM packages of orchestrated stages (no package_archive) come from the real registry (WP-05).
      JANE_LLM_REGISTRY_URL: ${JANE_E2E_LLM_REGISTRY_URL:-http://registry:8000}
    volumes:
      - ../tests/e2e/config/llm-seed.yaml:/cfg/llm-seed.yaml:ro

  assistant:
    environment:
      # SUBSTITUTE of a web search provider: static list with the test site.
      JANE_ASSISTANT_SEARCH_PROVIDER: static
      JANE_ASSISTANT_SEARCH_STATIC_FILE: /cfg/assistant-search.json
      # Neighbours of onboarding and improvement (S-M2-06/07); a scenario starts only those it needs.
      JANE_ASSISTANT_REGISTRY_URL: http://registry:8000
      JANE_ASSISTANT_COLLECTOR_WEB_URL: http://web-collector:8101
      JANE_ASSISTANT_ORCHESTRATOR_URL: http://orchestrator:8000
      JANE_ASSISTANT_DEFAULT_STORAGE_PACKAGE: jane.storage-postgresql@1.0.0
      JANE_ASSISTANT_DEFAULT_STORAGE_CONNECTION: results-pg
      # One material per classification request: the fake LLM answers by the content of the request, so a
      # scripted answer can classify exactly that material (tests/e2e/config/llm-seed.yaml). The pool the
      # diversity selection picks from stays ~10 materials (batch x poll_page_factor).
      # The assistant passes this limit with every LLM request; keep it aligned with the e2e gateway limit.
      JANE_ASSISTANT_LIMITS__LLM__MAX_REQUESTS_PER_MINUTE: ${JANE_E2E_LLM_MAX_REQUESTS_PER_MINUTE:-120}
      JANE_ASSISTANT_LIMITS__ONBOARDING__SAMPLE_BATCH_SIZE: "1"
      JANE_ASSISTANT_LIMITS__ONBOARDING__POLL_PAGE_FACTOR: "10"
      # Job lease and its renewal; the defaults are the service's own (60 s / 15 s). R-07 shortens them for its
      # stack so that the job of a killed assistant expires within the e2e budget.
      JANE_ASSISTANT_LIMITS__STATE__JOB_LEASE_MS: ${JANE_E2E_ASSISTANT_JOB_LEASE_MS:-60000}
      JANE_ASSISTANT_LIMITS__STATE__HEARTBEAT_INTERVAL_MS: ${JANE_E2E_ASSISTANT_HEARTBEAT_MS:-15000}
    volumes:
      - ../tests/e2e/config/assistant-search.json:/cfg/assistant-search.json:ro

  web-collector:
    environment:
      # Local rules packages (<package_id>/<version>/jane-package.json + rules.json).
      JANE_WEB_COLLECTOR_RULES_DIR: ${JANE_E2E_COLLECTOR_RULES_DIR:-/cfg/rules}
      JANE_WEB_COLLECTOR_REGISTRY_URL: ${JANE_E2E_COLLECTOR_REGISTRY_URL:-}
      JANE_WEB_COLLECTOR_LOG_FORMAT: json
      # Shorter lease than the default (30 s) so that take-over after a kill fits the e2e time budget;
      # the startup rule HEARTBEAT_INTERVAL_MS + STATE_BUSY_TIMEOUT_MS < LEASE_SECONDS*1000 holds.
      JANE_WEB_COLLECTOR_LEASE_SECONDS: ${JANE_E2E_COLLECTOR_LEASE_SECONDS:-10}
      JANE_WEB_COLLECTOR_HEARTBEAT_INTERVAL_MS: ${JANE_E2E_COLLECTOR_HEARTBEAT_MS:-2000}
      JANE_WEB_COLLECTOR_STATE_BUSY_TIMEOUT_MS: ${JANE_E2E_COLLECTOR_BUSY_TIMEOUT_MS:-5000}
    volumes:
      - ../tests/e2e/config/rules:/cfg/rules:ro
    depends_on:
      testsite: { condition: service_healthy }
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/v1/health', timeout=2)"]

  orchestrator:
    environment:
      JANE_ORCHESTRATOR_EXECUTORS: >-
        [{"executor": "web-collector", "role": "collector", "base_url": "http://web-collector:8101",
          "capabilities": {"collector": "web"}, "sync_connections": false},
         {"executor": "storage", "role": "handler", "base_url": "http://storage:8000",
          "capabilities": {"packages": ["jane.storage-*"]}},
         {"executor": "storage-read", "role": "storage_read", "base_url": "http://storage:8000",
          "sync_connections": false},
         {"executor": "handler-runtime", "role": "handler", "base_url": "http://handler-runtime:8000",
          "capabilities": {"default": true, "handler_kinds": ["extractor", "transform"]}, "sync_connections": false},
         {"executor": "llm", "role": "llm", "base_url": "http://llm:8110",
          "capabilities": {"packages": ["jane.llm-*", "e2e.llm-*"], "handler_kinds": ["llm"]}, "sync_connections": false}]
      # Shorter item/feed lease than the default (30 s): take-over after a killed worker fits the e2e budget.
      JANE_ORCHESTRATOR_LIMITS__ENGINE__LEASE_MS: ${JANE_E2E_ORCHESTRATOR_LEASE_MS:-8000}
      JANE_ORCHESTRATOR_LIMITS__ENGINE__HEARTBEAT_MS: ${JANE_E2E_ORCHESTRATOR_HEARTBEAT_MS:-2000}
      JANE_ORCHESTRATOR_LOG_FORMAT: json
      # Extra executors from a file: none by default; S-M2-06/07 add the real registry (activations, routing).
      JANE_ORCHESTRATOR_EXECUTORS_FILE: /cfg/orchestrator/${JANE_E2E_ORCHESTRATOR_EXTRA_EXECUTORS:-executors-none.json}
    volumes:
      - ../tests/e2e/config/orchestrator:/cfg/orchestrator:ro
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

  registry:
    environment:
      # Dependencies of extractor packages are checked against the runtime's published profile.
      JANE_REGISTRY_RUNTIME_PROFILES: '${JANE_E2E_REGISTRY_RUNTIME_PROFILES:-["http://handler-runtime:8000/v1/info"]}'
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

  telegram-collector:
    environment:
      JANE_TELEGRAM_COLLECTOR_CLIENT_BACKEND: recorded
      JANE_TELEGRAM_COLLECTOR_RECORDINGS_DIR: /cfg/recordings
    volumes:
      - ${JANE_E2E_TELEGRAM_RECORDINGS_DIR:?set by tests/e2e}:/cfg/recordings:ro
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/v1/health', timeout=2)"]

  # SUBSTITUTE (З) of a blob store's download_url for R-04 (gated downloads); it serves no package archives.
  package-host:
    profiles: ["package-host"]
    image: ${JANE_IMAGE_PYTHON:-python:3.12-slim}
    command: ["python", "/app/package_host.py", "8080"]
    volumes:
      - ../tests/e2e/jane_e2e/package_host.py:/app/package_host.py:ro
    ports: ["${JANE_BIND:-127.0.0.1}::8080"]
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=2)"]
