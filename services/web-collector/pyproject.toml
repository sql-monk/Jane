[project]
name = "jane-web-collector"
version = "0.1.0"
description = "Web Collector of the Jane platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jane-kit",
]

[project.scripts]
jane-web-collector = "jane_web_collector.__main__:main"

[tool.uv.sources]
jane-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_web_collector"]
