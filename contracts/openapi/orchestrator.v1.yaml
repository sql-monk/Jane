components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/defs.schema.json#/$defs/Id'
  schemas:
    TaskSummary:
      type: object
      required: [task_id, title, source_id, enabled]
      properties:
        task_id:
          type: string
        title:
          type: string
        source_id:
          type: string
        enabled:
          type: boolean
        schedule:
          $ref: '../schemas/task-config.schema.json#/$defs/Schedule'
        next_run_at:
          type: string
          format: date-time
        package_stages:
          type: array
          description: Етапи, що посилаються на пакет із фільтра package_id (лише коли фільтр задано).
          items:
            type: object
            required: [stage_id, package]
            properties:
              stage_id:
                type: string
              package:
                $ref: '../schemas/common/package-ref.schema.json'
        last_run:
          type: object
          properties:
            run_id:
              type: string
            status:
              $ref: '../schemas/common/job.schema.json#/$defs/JobStatus'
            finished_at:
              type: string
              format: date-time
    TaskValidation:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '../schemas/common/problem.schema.json#/$defs/FieldError'
        warnings:
          type: array
          items:
            $ref: '../schemas/common/problem.schema.json#/$defs/FieldError'
        effective_forward_unknown_to_llm:
          type: boolean
    RunRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
        test_mode:
          type: boolean
          default: false
          description: Етапи збереження не пишуть у робочі дані (ТЗ §10).
        input_override:
          type: object
          additionalProperties: false
          description: Перевизначення входу для цього запуску (джерело не змінюється).
          properties:
            urls:
              type: array
              items:
                type: string
