# Jane dev stack. Start it with `just up` (sets a unique project name, generated credentials and ports).
# Direct use:  docker compose -f infra/compose.yaml -p <unique-name> --env-file <file> up -d --wait
#
# Parameterisation (plan.md §3.4):
#   * project name: `-p` / COMPOSE_PROJECT_NAME -> container, network and volume names are prefixed with it;
#   * host ports: JANE_PORT_<SERVICE>; empty = Docker picks a free port (see `just env`);
#   * bind address: JANE_BIND (default 127.0.0.1, never exposed outside the host by default);
#   * credentials: generated by `just up`, never committed - including the API keys of the application
#     services (ADR-0005, auth_mode=api_key): JANE_API_KEY_<IDENTITY> is a caller's own key (the admin UI uses
#     JANE_API_KEY_ADMIN, see `just env`), JANE_API_KEY_<IDENTITY>_SHA256 is what the services verify;
#   * images: JANE_IMAGE_<SERVICE> to swap a registry or version.

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

services:
  postgres:
    image: ${JANE_IMAGE_POSTGRES:-postgres:18}
    environment:
      POSTGRES_USER: ${JANE_PG_USER:-jane}
      POSTGRES_PASSWORD: ${JANE_PG_PASSWORD:?run `just up` or set JANE_PG_PASSWORD}
      POSTGRES_DB: ${JANE_PG_DB:-jane}
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_POSTGRES:-}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  pg-provision:
    image: ${JANE_IMAGE_POSTGRES:-postgres:18}
    entrypoint: ["sh", "/opt/jane/provision.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${JANE_PG_USER:-jane}
      PGPASSWORD: ${JANE_PG_PASSWORD:?run `just up`}
      PGDATABASE: postgres
      JANE_PG_HANDLER_RUNTIME_PASSWORD: ${JANE_PG_HANDLER_RUNTIME_PASSWORD:?run `just up`}
      JANE_PG_ORCHESTRATOR_PASSWORD: ${JANE_PG_ORCHESTRATOR_PASSWORD:?run `just up`}
      JANE_PG_REGISTRY_PASSWORD: ${JANE_PG_REGISTRY_PASSWORD:?run `just up`}
      JANE_PG_LLM_PASSWORD: ${JANE_PG_LLM_PASSWORD:?run `just up`}
      JANE_PG_ASSISTANT_PASSWORD: ${JANE_PG_ASSISTANT_PASSWORD:?run `just up`}
      JANE_PG_STORAGE_RESULTS_PASSWORD: ${JANE_PG_STORAGE_RESULTS_PASSWORD:?run `just up`}
    volumes:
      - ./postgres/provision.sh:/opt/jane/provision.sh:ro
      - ./postgres/provision.sql:/opt/jane/provision.sql:ro
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  sqlserver:
    image: ${JANE_IMAGE_SQLSERVER:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${JANE_MSSQL_SA_PASSWORD:?run `just up` or set JANE_MSSQL_SA_PASSWORD}
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_SQLSERVER:-}:1433"]
    volumes: ["sqlserver-data:/var/opt/mssql"]
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' -b -o /dev/null"]

  mongodb:
    image: ${JANE_IMAGE_MONGODB:-mongo:8.0}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${JANE_MONGO_USER:-jane}
      MONGO_INITDB_ROOT_PASSWORD: ${JANE_MONGO_PASSWORD:?run `just up` or set JANE_MONGO_PASSWORD}
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_MONGODB:-}:27017"]
    volumes: ["mongodb-data:/data/db"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]

  # MinIO server. Upstream stopped publishing images; the default is a third-party community build of
  # the same server (pgsty/minio), pinned by digest - supplier risk, see infra/README.md.
  # Override JANE_IMAGE_MINIO to use another MinIO image.
  minio:
    image: ${JANE_IMAGE_MINIO:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${JANE_MINIO_ACCESS_KEY:-jane}
      MINIO_ROOT_PASSWORD: ${JANE_MINIO_SECRET_KEY:?run `just up` or set JANE_MINIO_SECRET_KEY}
    ports:
      - "${JANE_BIND:-127.0.0.1}:${JANE_PORT_MINIO:-}:9000"
      - "${JANE_BIND:-127.0.0.1}:${JANE_PORT_MINIO_CONSOLE:-}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]

  # S3-compatible substitute that is NOT MinIO (SeaweedFS S3 gateway), so the `s3` and `minio`
  # storage adapters are tested against two independent implementations (see infra/README.md).
  s3:
    image: ${JANE_IMAGE_S3:-chrislusf/seaweedfs:4.47}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"jane","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -master.volumeSizeLimitMB=${JANE_S3_VOLUME_SIZE_LIMIT_MB:-64} -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${JANE_S3_ACCESS_KEY:-jane}
      S3_SECRET_KEY: ${JANE_S3_SECRET_KEY:?run `just up` or set JANE_S3_SECRET_KEY}
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_S3:-}:8333"]
    volumes: ["s3-data:/data"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]

  # No `image:` on purpose: compose tags the build as <project>-testsite, so parallel stacks never
  # overwrite each other's image.
  testsite:
    build: ../tests/fixtures/testsite
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_TESTSITE:-}:8080"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/robots.txt', timeout=2)"]

  proxy:
    image: ${JANE_IMAGE_PROXY:-caddy:2-alpine}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${JANE_ADMIN_DIST_PATH:-./proxy/empty}:/srv/admin:ro
      - ${JANE_ADMIN_CONFIG_PATH:-./proxy/admin-config.json}:/srv/config/config.json:ro
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_PROXY:-}:8080"]
    environment:
      JANE_CSP_CONNECT_SRC: ${JANE_CSP_CONNECT_SRC:-}
      JANE_CSP_FORM_ACTION: ${JANE_CSP_FORM_ACTION:-}
    depends_on:
      testsite: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_proxy/health"]

  # Application services are opt-in: `just up storage assistant` starts only those profiles.
  storage:
    profiles: ["storage"]
    build: { context: .., dockerfile: services/storage/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_STORAGE_AUTH_MODE: api_key
      JANE_STORAGE_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["storage:read", "handler:invoke", "handler:test", "connections:write"]},
         {"name": "orchestrator", "sha256": "${JANE_API_KEY_ORCHESTRATOR_SHA256:?run `just up`}", "scopes": ["handler:invoke", "connections:write", "storage:read"]},
         {"name": "assistant", "sha256": "${JANE_API_KEY_ASSISTANT_SHA256:?run `just up`}", "scopes": ["storage:read"]}]
      JANE_STORAGE_REGISTRY_TOKEN: ${JANE_API_KEY_STORAGE:?run `just up`}
      JANE_STORAGE_CONNECTIONS_FILE: /cfg/storage-connections.json
      JANE_STORAGE_CONNECTION_HOST_ALLOWLIST: '["postgres:5432", "sqlserver:1433", "mongodb:27017", "minio:9000", "s3:8333"]'
      JANE_STORAGE_LOG_FORMAT: json
      # Reprocessing with from_stage = a storage stage (R19, ADR-0004 §3/§6): the restored Material of a RAW
      # stored by the files adapter keeps its persistent file:///var/lib/jane/storage/objects/... URI. Storage
      # may read only that RAW root of its own volume, not the adapter's deliveries, index or entities.
      JANE_STORAGE_CONTENT_FILES_DIR: /var/lib/jane/storage/objects
      # R18 (ADR-0004 §2): a RAW over transfer.inline_max_bytes without a persistent URI (format.raw json, the
      # PostgreSQL/MongoDB/SQL Server adapters) is returned by getObject as storage's transit blob
      # file:///var/lib/jane/storage/transit/storage/...; storage removes it after transfer.transit_ttl_seconds.
      JANE_STORAGE_TRANSIT_DIR: /var/lib/jane/storage/transit
      JANE_SECRET_DEV_PG_USER: jane_storage_results
      JANE_SECRET_DEV_PG_PASSWORD: ${JANE_PG_STORAGE_RESULTS_PASSWORD:?run `just up`}
    volumes:
      - storage-data:/var/lib/jane/storage
      - type: bind
        source: ${JANE_STORAGE_CONNECTIONS_FILE_HOST:-./config/storage-connections.json}
        target: /cfg/storage-connections.json
        read_only: true
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_STORAGE:-}:8000"]
    depends_on:
      pg-provision: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

  handler-runtime:
    profiles: ["handler-runtime"]
    build: { context: .., dockerfile: services/handler-runtime/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_HANDLER_RUNTIME_AUTH_MODE: api_key
      JANE_HANDLER_RUNTIME_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["handler:invoke", "handler:test", "connections:write"]},
         {"name": "orchestrator", "sha256": "${JANE_API_KEY_ORCHESTRATOR_SHA256:?run `just up`}", "scopes": ["handler:invoke", "connections:write"]},
         {"name": "assistant", "sha256": "${JANE_API_KEY_ASSISTANT_SHA256:?run `just up`}", "scopes": ["handler:invoke", "handler:test"]},
         {"name": "registry", "sha256": "${JANE_API_KEY_REGISTRY_SHA256:?run `just up`}", "scopes": []}]
      JANE_HANDLER_RUNTIME_REGISTRY_TOKEN: ${JANE_API_KEY_HANDLER_RUNTIME:?run `just up`}
      JANE_HANDLER_RUNTIME_STATE_DSN: postgresql://jane_handler_runtime:${JANE_PG_HANDLER_RUNTIME_PASSWORD:?run `just up`}@postgres:5432/jane_handler_runtime
      JANE_HANDLER_RUNTIME_LOG_FORMAT: json
      # Reprocessing of stored RAW: the files adapter of storage references it as file:///var/lib/jane/storage/objects/...
      # (ADR-0004: file:// only on one node with a shared volume). The volume is read-only and only its RAW objects
      # may be read (WP-01h policy), not the adapter's deliveries, index or entities; plus storage's transit blobs
      # of large RAW without a persistent URI (R18).
      JANE_HANDLER_RUNTIME_BLOB_ROOTS: '["/var/lib/jane/storage/objects", "/var/lib/jane/storage/transit/storage"]'
    volumes:
      - ${JANE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - storage-data:/var/lib/jane/storage:ro
    group_add: ["${JANE_DOCKER_GID:-0}"]
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_HANDLER_RUNTIME:-}:8000"]
    depends_on:
      pg-provision: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

  web-collector:
    profiles: ["web-collector"]
    build: { context: .., dockerfile: services/web-collector/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_WEB_COLLECTOR_AUTH_MODE: api_key
      JANE_WEB_COLLECTOR_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["collector:read", "collector:run", "connections:write"]},
         {"name": "orchestrator", "sha256": "${JANE_API_KEY_ORCHESTRATOR_SHA256:?run `just up`}", "scopes": ["collector:read", "collector:run", "connections:write"]},
         {"name": "assistant", "sha256": "${JANE_API_KEY_ASSISTANT_SHA256:?run `just up`}", "scopes": ["collector:read", "collector:run"]}]
      JANE_WEB_COLLECTOR_REGISTRY_TOKEN_ENV: JANE_SECRET_WEB_COLLECTOR_TOKEN
      JANE_SECRET_WEB_COLLECTOR_TOKEN: ${JANE_API_KEY_WEB_COLLECTOR:?run `just up`}
    volumes: ["web-collector-data:/var/lib/jane-web-collector"]
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_WEB_COLLECTOR:-}:8101"]

  telegram-collector:
    profiles: ["telegram-collector"]
    build: { context: .., dockerfile: services/telegram-collector/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_TELEGRAM_COLLECTOR_AUTH_MODE: api_key
      JANE_TELEGRAM_COLLECTOR_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["collector:read", "collector:run", "connections:write"]},
         {"name": "orchestrator", "sha256": "${JANE_API_KEY_ORCHESTRATOR_SHA256:?run `just up`}", "scopes": ["collector:read", "collector:run", "connections:write"]},
         {"name": "assistant", "sha256": "${JANE_API_KEY_ASSISTANT_SHA256:?run `just up`}", "scopes": ["collector:read", "collector:run"]}]
      JANE_TELEGRAM_COLLECTOR_REGISTRY_TOKEN_ENV: JANE_SECRET_TELEGRAM_COLLECTOR_TOKEN
      JANE_SECRET_TELEGRAM_COLLECTOR_TOKEN: ${JANE_API_KEY_TELEGRAM_COLLECTOR:?run `just up`}
    volumes: ["telegram-collector-data:/var/lib/jane-telegram-collector"]
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_TELEGRAM_COLLECTOR:-}:8102"]

  orchestrator:
    profiles: ["orchestrator"]
    build: { context: .., dockerfile: services/orchestrator/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_ORCHESTRATOR_AUTH_MODE: api_key
      JANE_ORCHESTRATOR_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["orchestrator:read", "orchestrator:write", "orchestrator:admin"]},
         {"name": "assistant", "sha256": "${JANE_API_KEY_ASSISTANT_SHA256:?run `just up`}", "scopes": ["orchestrator:read", "orchestrator:write"]}]
      JANE_ORCHESTRATOR_SERVICE_TOKEN_REF: env:JANE_SECRET_ORCHESTRATOR_TOKEN
      JANE_SECRET_ORCHESTRATOR_TOKEN: ${JANE_API_KEY_ORCHESTRATOR:?run `just up`}
      JANE_ORCHESTRATOR_DATABASE_URL: postgresql://jane_orchestrator:${JANE_PG_ORCHESTRATOR_PASSWORD:?run `just up`}@postgres:5432/jane_orchestrator
      # Set to false in the caller's environment to start the API without schedules / run workers
      # (backup, restore, upgrades - docs/operations/README.md).
      JANE_ORCHESTRATOR_SCHEDULER_ENABLED: ${JANE_ORCHESTRATOR_SCHEDULER_ENABLED:-true}
      JANE_ORCHESTRATOR_RUN_WORKERS: ${JANE_ORCHESTRATOR_RUN_WORKERS:-true}
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_ORCHESTRATOR:-}:8000"]
    depends_on:
      pg-provision: { condition: service_completed_successfully }

  registry:
    profiles: ["registry"]
    build: { context: .., dockerfile: services/registry/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_REGISTRY_AUTH_MODE: api_key
      JANE_REGISTRY_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["registry:read", "registry:write", "registry:approve"]},
         {"name": "orchestrator", "sha256": "${JANE_API_KEY_ORCHESTRATOR_SHA256:?run `just up`}", "scopes": ["registry:read"]},
         {"name": "assistant", "sha256": "${JANE_API_KEY_ASSISTANT_SHA256:?run `just up`}", "scopes": ["registry:read", "registry:write", "registry:approve"], "actor": "llm"},
         {"name": "handler-runtime", "sha256": "${JANE_API_KEY_HANDLER_RUNTIME_SHA256:?run `just up`}", "scopes": ["registry:read"]},
         {"name": "storage", "sha256": "${JANE_API_KEY_STORAGE_SHA256:?run `just up`}", "scopes": ["registry:read"]},
         {"name": "llm", "sha256": "${JANE_API_KEY_LLM_SHA256:?run `just up`}", "scopes": ["registry:read"]},
         {"name": "web-collector", "sha256": "${JANE_API_KEY_WEB_COLLECTOR_SHA256:?run `just up`}", "scopes": ["registry:read"]},
         {"name": "telegram-collector", "sha256": "${JANE_API_KEY_TELEGRAM_COLLECTOR_SHA256:?run `just up`}", "scopes": ["registry:read"]}]
      JANE_REGISTRY_RUNTIME_PROFILES_TOKEN_REF: env:JANE_SECRET_REGISTRY_TOKEN
      JANE_SECRET_REGISTRY_TOKEN: ${JANE_API_KEY_REGISTRY:?run `just up`}
      JANE_REGISTRY_DB_URL: postgresql://jane_registry:${JANE_PG_REGISTRY_PASSWORD:?run `just up`}@postgres:5432/jane_registry
      JANE_REGISTRY_DB_SCHEMA: jane_registry
      JANE_REGISTRY_S3_ENDPOINT_URL: http://minio:9000
      JANE_REGISTRY_S3_ACCESS_KEY: ${JANE_MINIO_ACCESS_KEY:-jane}
      JANE_REGISTRY_S3_SECRET_KEY: ${JANE_MINIO_SECRET_KEY:?run `just up`}
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_REGISTRY:-}:8000"]
    depends_on:
      pg-provision: { condition: service_completed_successfully }
      minio: { condition: service_healthy }

  llm:
    profiles: ["llm", "assistant"]
    build: { context: .., dockerfile: services/llm/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_LLM_AUTH_MODE: api_key
      JANE_LLM_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["llm:invoke", "llm:admin", "handler:invoke", "handler:test", "connections:write"]},
         {"name": "orchestrator", "sha256": "${JANE_API_KEY_ORCHESTRATOR_SHA256:?run `just up`}", "scopes": ["handler:invoke", "connections:write", "llm:admin"]},
         {"name": "assistant", "sha256": "${JANE_API_KEY_ASSISTANT_SHA256:?run `just up`}", "scopes": ["llm:invoke"]}]
      JANE_LLM_REGISTRY_TOKEN: ${JANE_API_KEY_LLM:?run `just up`}
      JANE_LLM_STORE: postgres
      JANE_LLM_DATABASE_URL: postgresql://jane_llm:${JANE_PG_LLM_PASSWORD:?run `just up`}@postgres:5432/jane_llm
      JANE_LLM_FAKE_PROVIDER_ENABLED: "true"
      JANE_LLM_LOG_FORMAT: json
      # Reprocessing from an LLM stage gets stored RAW as file:///var/lib/jane/storage/objects/... or storage's transit
      # blob of a large RAW without a persistent URI (as handler-runtime).
      JANE_LLM_BLOB_ROOTS: '["/var/lib/jane/storage/objects", "/var/lib/jane/storage/transit/storage"]'
    volumes:
      - storage-data:/var/lib/jane/storage:ro
      # Provider keys for `file:` secret references (ADR-0006): one file per secret in the git-ignored
      # .jane/secrets of the checkout (or JANE_SECRETS_DIR), read-only at the service's default
      # JANE_LLM_SECRET_FILES_DIR. Connections in the database keep only the reference, e.g.
      # file:/run/secrets/anthropic_api_key (scripts/llm_anthropic.py).
      - ${JANE_SECRETS_DIR:-../.jane/secrets}:/run/secrets:ro
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_LLM:-}:8110"]
    depends_on:
      pg-provision: { condition: service_completed_successfully }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/v1/health', timeout=2)"]

  assistant:
    profiles: ["assistant"]
    build: { context: .., dockerfile: services/assistant/Dockerfile }
    environment:
      # ADR-0005: API keys verified by hash (generated by `just up`), scopes per caller; the service's own
      # token for its neighbours comes from the environment.
      JANE_ASSISTANT_AUTH_MODE: api_key
      JANE_ASSISTANT_API_KEYS: >-
        [{"name": "admin", "sha256": "${JANE_API_KEY_ADMIN_SHA256:?run `just up`}", "scopes": ["assistant:use"]}]
      JANE_ASSISTANT_SERVICE_TOKEN_REF: env:JANE_SECRET_ASSISTANT_TOKEN
      JANE_SECRET_ASSISTANT_TOKEN: ${JANE_API_KEY_ASSISTANT:?run `just up`}
      JANE_ASSISTANT_STATE_DSN: postgresql://jane_assistant:${JANE_PG_ASSISTANT_PASSWORD:?run `just up`}@postgres:5432/jane_assistant
      JANE_ASSISTANT_LLM_URL: http://llm:8110
      JANE_ASSISTANT_HANDLER_RUNTIME_URL: http://handler-runtime:8000
      JANE_ASSISTANT_STORAGE_URL: http://storage:8000
      JANE_ASSISTANT_LOG_FORMAT: json
    ports: ["${JANE_BIND:-127.0.0.1}:${JANE_PORT_ASSISTANT:-}:8000"]
    depends_on:
      pg-provision: { condition: service_completed_successfully }
      llm: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

volumes:
  postgres-data:
  sqlserver-data:
  mongodb-data:
