[project]
name = "jane-registry"
version = "0.1.0"
description = "Handler package registry of the Jane platform: immutable versions, forks, diff, upstream ports, export."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jane-kit",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.35",
    "packaging>=24",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "httpx>=0.27",
]

[project.scripts]
jane-registry = "jane_registry.__main__:main"

[tool.uv.sources]
jane-kit = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_registry"]
