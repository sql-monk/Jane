[project]
name = "jane-handler-runtime"
version = "0.1.0"
description = "Handler Runtime of the Jane platform: runs Python extractor packages in a container sandbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jane-kit",
    "jane-extractor-sdk",
    "docker>=7.1",
    "packaging>=24.0",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[project.scripts]
jane-handler-runtime = "jane_handler_runtime.cli:main"

[tool.uv.sources]
jane-kit = { workspace = true }
jane-extractor-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_handler_runtime"]
