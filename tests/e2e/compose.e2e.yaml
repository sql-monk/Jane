# Jane e2e overlay (WP-13): application services on top of infra/compose.yaml.
#
#   docker compose -f infra/compose.yaml -f tests/e2e/compose.e2e.yaml -p <unique> up -d --wait <services>
#
# Used by tests/e2e (jane_e2e.stack.E2EStack), which sets a unique project, generated credentials and:
#   COMPOSE_PROFILES        application services present in this checkout (profile name == service name);
#   JANE_E2E_SANDBOX_IMAGE  image of runtime profile python-extractor@1 (built by `jane-handler-runtime build-image`);
#   JANE_E2E_DOCKER_SOCKET  docker API socket for handler-runtime sandboxes (default /var/run/docker.sock);
#   JANE_E2E_DOCKER_GID     group of that socket inside containers (0 on Docker Desktop, docker gid on Linux).
#
# NOTE: with several -f files compose resolves relative paths against the FIRST file (infra/), hence `..`.
# A service joins this file when its WP is merged into main; until then tests skip with the reason.
# Host ports are chosen by Docker (127.0.0.1 only); `docker compose port` / E2EStack.url() read them.

x-e2e-health: &e2e-health
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  storage:
    profiles: ["storage"]
    build:
      context: ..
      dockerfile: services/storage/Dockerfile
    environment:
      JANE_STORAGE_CONNECTIONS_FILE: /cfg/storage-connections.json
      JANE_STORAGE_LOG_FORMAT: json
      # Secret values only through secret_refs (ADR-0006); names use the JANE_SECRET_ prefix.
      JANE_SECRET_E2E_PG_USER: ${JANE_PG_USER:-jane}
      JANE_SECRET_E2E_PG_PASSWORD: ${JANE_PG_PASSWORD:?set by tests/e2e}
    volumes:
      - storage-data:/var/lib/jane/storage
      - ../tests/e2e/config/storage-connections.json:/cfg/storage-connections.json:ro
    ports: ["${JANE_BIND:-127.0.0.1}::8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

  handler-runtime:
    profiles: ["handler-runtime"]
    build:
      context: ..
      dockerfile: services/handler-runtime/Dockerfile
    environment:
      JANE_HANDLER_RUNTIME_PROFILE_IMAGES: '{"python-extractor@1": "${JANE_E2E_SANDBOX_IMAGE:?set by tests/e2e}"}'
      JANE_HANDLER_RUNTIME_SANDBOX_LABELS: '{"io.jane.e2e-project": "${JANE_E2E_PROJECT:-jane-e2e}"}'
      # Shared state of several instances (idempotency keys, jobs, results) in the service's own schema.
      JANE_HANDLER_RUNTIME_STATE_DSN: postgresql://${JANE_PG_USER:-jane}:${JANE_PG_PASSWORD:?set by tests/e2e}@postgres:5432/${JANE_PG_DB:-jane}
      JANE_HANDLER_RUNTIME_LOG_FORMAT: json
    volumes:
      - ${JANE_E2E_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    group_add: ["${JANE_E2E_DOCKER_GID:-0}"]
    ports: ["${JANE_BIND:-127.0.0.1}::8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

  llm:
    profiles: ["llm"]
    build:
      context: ..
      dockerfile: services/llm/Dockerfile
    environment:
      JANE_LLM_STORE: postgres
      JANE_LLM_DATABASE_URL: postgresql://${JANE_PG_USER:-jane}:${JANE_PG_PASSWORD:?set by tests/e2e}@postgres:5432/${JANE_PG_DB:-jane}
      # SUBSTITUTE of the external LLM: deterministic provider `fake` (real Anthropic - not verified).
      JANE_LLM_FAKE_PROVIDER_ENABLED: "true"
      JANE_LLM_SEED_FILE: /cfg/llm-seed.yaml
      JANE_LLM_LOG_FORMAT: json
    volumes:
      - ../tests/e2e/config/llm-seed.yaml:/cfg/llm-seed.yaml:ro
    ports: ["${JANE_BIND:-127.0.0.1}::8110"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/v1/health', timeout=2)"]

  assistant:
    profiles: ["assistant"]
    build:
      context: ..
      dockerfile: services/assistant/Dockerfile
    environment:
      JANE_ASSISTANT_STATE_DSN: postgresql://${JANE_PG_USER:-jane}:${JANE_PG_PASSWORD:?set by tests/e2e}@postgres:5432/${JANE_PG_DB:-jane}
      JANE_ASSISTANT_LLM_URL: http://llm:8110
      JANE_ASSISTANT_HANDLER_RUNTIME_URL: http://handler-runtime:8000
      JANE_ASSISTANT_STORAGE_URL: http://storage:8000
      # Neighbours not merged yet (registry, collectors, orchestrator) are added with their WPs.
      # SUBSTITUTE of a web search provider: static list with the test site.
      JANE_ASSISTANT_SEARCH_PROVIDER: static
      JANE_ASSISTANT_SEARCH_STATIC_FILE: /cfg/assistant-search.json
      JANE_ASSISTANT_LOG_FORMAT: json
    volumes:
      - ../tests/e2e/config/assistant-search.json:/cfg/assistant-search.json:ro
    ports: ["${JANE_BIND:-127.0.0.1}::8000"]
    depends_on:
      postgres: { condition: service_healthy }
      llm: { condition: service_healthy }
    healthcheck:
      <<: *e2e-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]

volumes:
  storage-data:
