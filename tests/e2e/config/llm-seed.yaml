# e2e seed of the LLM gateway (JANE_LLM_SEED_FILE). The external LLM is replaced by the built-in deterministic
# provider `fake` (JANE_LLM_FAKE_PROVIDER_ENABLED=true) - a SUBSTITUTE of an external system, see
# docs/acceptance/matrix.md.
#
# S-M2-05a / S-M2-06 / S-M2-07: the assistant's model aliases `cheap` and `strong` point at the provider
# `e2e-assistant` (kind fake) whose answers are scripted in the connection `e2e-assistant-scripts` below.
#
# S-M2-05 / S-M2-11: the LLM package tests/e2e/packages/e2e.llm-page-triage uses the alias `e2e-triage` ->
# provider `e2e-fake` (kind fake, non-zero prices so that cost accounting is visible). Its answers are scripted
# in the connection below (fake provider: first `when_data_contains` match of the data channel -> `output`;
# no match -> the minimal value valid for the output schema). No secrets: the fake provider needs none.
connections:
  - connection_id: e2e-fake-scripts
    kind: llm_provider
    title: "e2e: scripted answers of the fake LLM provider (S-M2-05, S-M2-11)"
    params:
      provider: fake
      responses:
        # S-M2-11: problem result of the extractor (OutOfStock offer) -> valid triage, stored by the task.
        - when_data_contains: "<h1>Phone Gamma</h1>"
          output:
            page_triages:
              - page_type: product
                summary: "Product card with an out-of-stock offer; the extractor handles in-stock offers only."
                suggested_fix: "Map schema.org OutOfStock to availability out_of_stock."
        # S-M2-11: output that violates the package output schema (page_type is not in the enum) - the
        # gateway must reject it (valid=false) and the task must not store it.
        - when_data_contains: "<h1>Phone Zeta</h1>"
          output:
            page_triages:
              - page_type: preorder
                summary: "Product card with a pre-order offer."
        # S-M2-05: unknown pages of the test site (page_types: unknown).
        - when_data_contains: "<h1>Spring meetup</h1>"
          output:
            page_triages:
              - page_type: event
                summary: "Event announcement with a date, a place and free entrance."
                suggested_fix: "An event extractor bound to /pages/event-*."
        - when_data_contains: "<h1>Careers</h1>"
          output:
            page_triages:
              - page_type: job
                summary: "Job posting for a warehouse operator."
        - when_data_contains: "<h1>FAQ</h1>"
          output:
            page_triages:
              - page_type: faq
                summary: "Questions and answers about delivery and returns."

  # S-M2-06 / S-M2-07: answers of the fake model to the source assistant (WP-11). They only give the TEXT of the
  # model's answer; every step around them (sampling through the real Web Collector, guards, manifests, tests in
  # the real runtime, publication, activation) runs the real code. The steps are told apart by the first data
  # part the assistant sends (services/assistant/src/jane_assistant/prompts.py and onboarding.py):
  #   classify            `url: <material>` - one material per request (sample_batch_size=1, compose.e2e.yaml);
  #   analyze             JSON `context` ({"hints": ...});
  #   propose             JSON `analysis` ({"discovery_methods": ...});
  #   generate_extractor  JSON `spec` ({"entity_type": "product", ...});
  #   improve             JSON `package` - the manifest of tests/e2e/packages/e2e.improvable-product-extractor.
  # Anything else (e.g. S-M2-05a's unknown page, fetched from the host URL) gets the minimal valid answer.
  - connection_id: e2e-assistant-scripts
    kind: llm_provider
    title: "e2e: scripted answers of the fake LLM provider to the source assistant (S-M2-06, S-M2-07)"
    params:
      provider: fake
      responses:
        # ---- classify: the material type of one test-site page by its <meta name="jane:page-type">.
        - when_data_matches: '(?s)^url: http://testsite:8080/[^\n]*\n\n.*<meta name="jane:page-type" content="product">'
          output: {items: [{name: m0, material_type: product, confidence: 0.95}]}
        - when_data_matches: '(?s)^url: http://testsite:8080/[^\n]*\n\n.*<meta name="jane:page-type" content="category">'
          output: {items: [{name: m0, material_type: category, confidence: 0.9}]}
        - when_data_matches: '(?s)^url: http://testsite:8080/[^\n]*\n\n.*<meta name="jane:page-type" content="news">'
          output: {items: [{name: m0, material_type: article, confidence: 0.9}]}
        - when_data_matches: '(?s)^url: http://testsite:8080/[^\n]*\n\n.*<meta name="jane:page-type" content="news-list">'
          output: {items: [{name: m0, material_type: news_list, confidence: 0.9}]}
        # Home, about, events/jobs/FAQ, loops, archive...: a catch-all type the model is less sure about.
        - when_data_matches: '^url: http://testsite:8080/'
          output: {items: [{name: m0, material_type: other, confidence: 0.6}]}
        # ---- analyze: the source kind, discovery methods and the entity of product pages.
        - when_data_matches: '^\{\s*"hints": '
          output:
            source_kind: web
            discovery_methods: [sitemap, feed, listing, recursive]
            entities:
              - entity_type: product
                material_type: product
                fields:
                  - {name: sku, type: string, coverage: 1, examples: [phone-alpha]}
                  - {name: title, type: string, coverage: 1, examples: [Phone Alpha]}
                  - {name: price, type: money, coverage: 1, examples: ["299.00 UAH"]}
                  - {name: availability, type: string, coverage: 1, examples: [in_stock, out_of_stock]}
                  - {name: url, type: url, coverage: 1}
        # ---- propose: several collection plans with their risks (sections and limits are left to Jane).
        - when_data_matches: '^\{\s*"discovery_methods": '
          output:
            proposals:
              - title: Sitemap index with the product extractor
                summary: Every page listed in /sitemap.xml; product cards go to the product extractor.
                recommended: true
                strategies:
                  - {type: sitemap, urls: ["http://testsite:8080/sitemap.xml"]}
                entity_types: [product]
                risks:
                  - Products that are missing from the sitemap (for example API-only items) are not collected.
              - title: Recursive crawl from the home page
                summary: Follows links from the home page inside the site.
                recommended: false
                strategies:
                  - {type: recursive, seeds: ["http://testsite:8080/"]}
                exclude: ["testsite/calendar/**"]
                entity_types: [product]
                risks:
                  - More requests per run than the sitemap plan.
                  - The calendar pages link to each other endlessly; the crawl relies on exclusions and depth limits.
        # ---- generate_extractor: a new product extractor for the test site (standard library only).
        - when_data_matches: '^\{\s*"entity_type": "product"'
          output:
            summary: Product cards from the schema.org JSON-LD block; pages without it are empty.
            key_fields: [sku]
            entity_schema:
              type: object
              additionalProperties: false
              required: [sku, title, price]
              properties:
                sku: {type: string, minLength: 1}
                title: {type: string, minLength: 1}
                price:
                  type: object
                  additionalProperties: false
                  required: [amount, currency]
                  properties:
                    amount: {type: number, minimum: 0}
                    currency: {type: string, pattern: "^[A-Z]{3}$"}
                availability: {type: string, enum: [in_stock, out_of_stock, pre_order]}
                url: {type: string}
            expectations:
              - {name: sample_0, expected_status: success, entities: [{entity_type: product, fields: {price: {currency: UAH}}}]}
              - {name: sample_1, expected_status: success, entities: [{entity_type: product, fields: {price: {currency: UAH}}}]}
              - {name: sample_2, expected_status: success, entities: [{entity_type: product, fields: {price: {currency: UAH}}}]}
              - {name: neg_0, expected_status: empty}
            module_code: |
              import json
              import re

              LD_JSON = re.compile(r'<script type="application/ld\+json">(.*?)</script>', re.DOTALL)
              AVAILABILITY = {"InStock": "in_stock", "OutOfStock": "out_of_stock", "PreOrder": "pre_order"}


              def _product(html):
                  for block in LD_JSON.findall(html):
                      try:
                          doc = json.loads(block)
                      except ValueError:
                          continue
                      if isinstance(doc, dict) and doc.get("@type") == "Product":
                          return doc
                  return None


              def extract(material, params, ctx):
                  doc = _product(ctx.text())
                  if doc is None:
                      return {"status": "empty", "entities": []}
                  offers = doc.get("offers") or {}
                  fields = {}
                  if doc.get("sku"):
                      fields["sku"] = str(doc["sku"])
                  if doc.get("name"):
                      fields["title"] = str(doc["name"])
                  try:
                      fields["price"] = {"amount": float(offers["price"]), "currency": str(offers["priceCurrency"])}
                  except (KeyError, TypeError, ValueError):
                      pass
                  availability = AVAILABILITY.get(str(offers.get("availability", "")).rsplit("/", 1)[-1])
                  if availability:
                      fields["availability"] = availability
                  url = (material.get("locator") or {}).get("url")
                  if url:
                      fields["url"] = str(url)
                  scope = (material.get("source") or {}).get("source_id", "local")
                  missing = [name for name in ("sku", "title", "price") if name not in fields]
                  if missing:
                      entities = []
                      if "sku" in fields:
                          key = {"scope": scope, "natural": {"sku": fields["sku"]}}
                          entities.append(
                              {"entity_type": "product", "key": key, "fields": fields, "completeness": "partial"}
                          )
                      return {
                          "status": "unrecognized",
                          "entities": entities,
                          "unrecognized": {
                              "partial": bool(entities),
                              "reason": "product card without " + ", ".join(missing),
                              "signature": "missing-field:" + ",".join(missing),
                          },
                      }
                  key = {"scope": scope, "natural": {"sku": fields["sku"]}}
                  return {
                      "status": "success",
                      "entities": [{"entity_type": "product", "key": key, "fields": fields, "completeness": "full"}],
                  }
        # ---- improve: the fix of e2e.improvable-product-extractor for OutOfStock / PreOrder offers.
        #      p1 / p2 are the problem samples in the order S-M2-07 sends them (phone-gamma, phone-zeta).
        - when_data_matches: '(?s)^\{\s*"access": .*"module": "e2e_improvable_products\.main"'
          output:
            change_summary: >-
              Map schema.org OutOfStock and PreOrder offers to availability out_of_stock and pre_order
              instead of reporting them as unrecognized; the entity schema gains the two values (additive).
            schema_change: additive
            expectations:
              - {name: p1, expected_status: success, entities: [{entity_type: product, fields: {sku: phone-gamma, availability: out_of_stock}}]}
              - {name: p2, expected_status: success, entities: [{entity_type: product, fields: {sku: phone-zeta, availability: pre_order}}]}
            files:
              schemas/product.schema.json: |
                {
                  "$schema": "https://json-schema.org/draft/2020-12/schema",
                  "title": "product",
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["sku"],
                  "properties": {
                    "sku": { "type": "string", "minLength": 1 },
                    "title": { "type": "string", "minLength": 1 },
                    "price": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["amount", "currency"],
                      "properties": {
                        "amount": { "type": "number", "minimum": 0 },
                        "currency": { "type": "string", "pattern": "^[A-Z]{3}$" }
                      }
                    },
                    "availability": { "type": "string", "enum": ["in_stock", "out_of_stock", "pre_order"] }
                  }
                }
              src/e2e_improvable_products/main.py: |
                """E2E fixture extractor (WP-13, S-M2-07) as improved by the source assistant: product cards of the
                test site with in-stock, out-of-stock and pre-order offers; other availability stays unrecognized."""

                import json
                import re

                _LD_JSON = re.compile(r'<script type="application/ld\+json">(.*?)</script>', re.DOTALL)
                _AVAILABILITY = {"InStock": "in_stock", "OutOfStock": "out_of_stock", "PreOrder": "pre_order"}


                def _product(html):
                    for block in _LD_JSON.findall(html):
                        try:
                            doc = json.loads(block)
                        except ValueError:
                            continue
                        if isinstance(doc, dict) and doc.get("@type") == "Product":
                            return doc
                    return None


                def extract(material, params, ctx):
                    ld = _product(ctx.text())
                    if ld is None:
                        return {"status": "empty", "entities": []}
                    offers = ld.get("offers") or {}
                    fields = {"sku": ld.get("sku"), "title": ld.get("name")}
                    try:
                        fields["price"] = {"amount": float(offers["price"]), "currency": str(offers["priceCurrency"])}
                    except (KeyError, TypeError, ValueError):
                        fields["price"] = None
                    fields = {k: v for k, v in fields.items() if v is not None}
                    availability = str(offers.get("availability", "")).rsplit("/", 1)[-1]
                    if availability not in _AVAILABILITY:
                        ctx.log.warning("offer availability is not handled", code="extract.unknown_availability")
                        return {
                            "status": "unrecognized",
                            "entities": [{"entity_type": "product", "fields": fields, "completeness": "partial"}],
                            "unrecognized": {
                                "partial": True,
                                "reason": "offer availability is not handled by this extractor",
                                "signature": "unknown-availability",
                            },
                        }
                    fields["availability"] = _AVAILABILITY[availability]
                    return {
                        "status": "success",
                        "entities": [{"entity_type": "product", "fields": fields, "completeness": "full"}],
                    }

providers:
  - provider_id: e2e-fake
    kind: fake
    connection_id: e2e-fake-scripts
    enabled: true
    models:
      - model_id: fake-deterministic-1
        max_context_tokens: 128000
        supports_structured_output: true
        pricing: {input_per_mtok: 1, output_per_mtok: 4, currency: USD}
  - provider_id: e2e-assistant
    kind: fake
    connection_id: e2e-assistant-scripts
    enabled: true
    models:
      - model_id: fake-deterministic-1
        max_context_tokens: 128000
        supports_structured_output: true
        pricing: {input_per_mtok: 1, output_per_mtok: 4, currency: USD}

model_aliases:
  - {alias: cheap, provider_id: e2e-assistant, model_id: fake-deterministic-1}
  - {alias: strong, provider_id: e2e-assistant, model_id: fake-deterministic-1}
  - {alias: e2e-triage, provider_id: e2e-fake, model_id: fake-deterministic-1}
