[project]
name = "jane-storage-sqlserver"
version = "0.1.0"
description = "SQL Server adapter of the Jane storage handler (entities with history, RAW objects as varbinary(max))."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jane-storage",
    "jane-contracts",
    # pymssql ships FreeTDS in its wheels (Windows and Linux): no ODBC driver to install.
    "pymssql>=2.3",
]

# Registration in the storage core (see services/storage/README.md, "Адаптери").
[project.entry-points."jane.storage.adapters"]
sqlserver = "jane_storage_sqlserver:SqlServerAdapter"

[project.entry-points."jane.storage.packages"]
"jane.storage-sqlserver" = "jane_storage_sqlserver:package_dir"

[tool.uv.sources]
# A path (not workspace) source: uv does not treat a project nested in another member as a workspace
# member when building it, see services/storage/README.md.
jane-storage = { path = "../..", editable = true }
jane-contracts = { path = "../../../../contracts/python", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_storage_sqlserver"]
