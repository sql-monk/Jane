# Cross-service wiring for a working local system. The base infra/compose.yaml deliberately leaves it
# optional (tests wire what they need). Copy to infra/compose.local.yaml (git-ignored): `just up` then
# includes it in every compose call. Same executors as web/admin/scripts/configure-real-stack.mjs,
# without its test fakes.
services:
  registry:
    environment:
      JANE_REGISTRY_RUNTIME_PROFILES: '["http://handler-runtime:8000/v1/info"]'
  handler-runtime:
    environment:
      JANE_HANDLER_RUNTIME_REGISTRY_URL: http://registry:8000
  web-collector:
    build:
      # fetch.render_js: Playwright and headless Chromium in the image (pages whose prices are built by scripts)
      args:
        EXTRAS: --extra render
    environment:
      JANE_WEB_COLLECTOR_REGISTRY_URL: http://registry:8000
      # Real shop pages are often 0.5-2 MB; without a blob store larger pages fail with limit_exceeded
      # (default 256 KiB for inline delivery).
      JANE_WEB_COLLECTOR_LIMITS__TRANSFER__INLINE_MAX_BYTES: "8388608"
      # examples/sites: ~30 periodic sources (news and Telegram every 15 min next to hour-long catalog scans).
      # The default of 4 collections at once queues the short ones behind the long ones; a full catalog scan
      # at 1 request/s also needs more than the default job limit of one hour.
      JANE_WEB_COLLECTOR_JOBS__MAX_CONCURRENT_JOBS: "32"
      JANE_WEB_COLLECTOR_JOBS__JOB_TIMEOUT_MS: "14400000"
  telegram-collector:
    build:
      # real Telegram: Telethon in the image; the account comes from the tg-main connection whose secrets are
      # file:/run/secrets/tg_api_hash and tg_session (scripts/tg_session.py writes them to .jane/secrets)
      args:
        EXTRAS: --extra telethon
    environment:
      JANE_TELEGRAM_COLLECTOR_CLIENT_BACKEND: telethon
      JANE_TELEGRAM_COLLECTOR_REGISTRY_URL: http://registry:8000
    volumes:
      - ../.jane/secrets:/run/secrets:ro
  orchestrator:
    environment:
      JANE_ORCHESTRATOR_EXECUTORS: >-
        [{"executor": "web-collector", "role": "collector", "base_url": "http://web-collector:8101",
          "capabilities": {"collector": "web"}},
         {"executor": "handler-runtime", "role": "handler", "base_url": "http://handler-runtime:8000",
          "capabilities": {"handler_kinds": ["extractor", "transform"], "default": true}},
         {"executor": "storage", "role": "handler", "base_url": "http://storage:8000",
          "capabilities": {"packages": ["jane.storage-*"], "handler_kinds": ["storage"]}},
         {"executor": "storage-read", "role": "storage_read", "base_url": "http://storage:8000",
          "sync_connections": false},
         {"executor": "registry", "role": "registry", "base_url": "http://registry:8000"},
         {"executor": "llm", "role": "llm", "base_url": "http://llm:8110", "capabilities": {"handler_kinds": ["llm"]}},
         {"executor": "telegram-collector", "role": "collector", "base_url": "http://telegram-collector:8102",
          "capabilities": {"collector": "telegram"}},
         {"executor": "assistant", "role": "assistant", "base_url": "http://assistant:8000"}]
  llm:
    environment:
      JANE_LLM_REGISTRY_URL: http://registry:8000
  assistant:
    environment:
      JANE_ASSISTANT_REGISTRY_URL: http://registry:8000
      JANE_ASSISTANT_ORCHESTRATOR_URL: http://orchestrator:8000
      JANE_ASSISTANT_COLLECTOR_WEB_URL: http://web-collector:8101
      JANE_ASSISTANT_COLLECTOR_TELEGRAM_URL: http://telegram-collector:8102
