# e2e seed of the LLM gateway (JANE_LLM_SEED_FILE). The external LLM is replaced by the built-in deterministic
# provider `fake` (JANE_LLM_FAKE_PROVIDER_ENABLED=true) - a SUBSTITUTE of an external system, see
# docs/acceptance/matrix.md. The assistant's model aliases point at it.
model_aliases:
  - {alias: cheap, provider_id: fake, model_id: fake-deterministic-1}
  - {alias: strong, provider_id: fake, model_id: fake-deterministic-1}
