openapi: 3.1.0
info:
  title: Jane Source Assistant API
  version: 1.0.0
  description: |
    Асистент джерел (WP-11): підключення нового джерела за назвою чи посиланням, вдосконалення
    екстракторів на проблемних прикладах, обробка невідомих матеріалів (лише коли оркестратор
    передав їх за увімкненим прапорцем «Передавати в LLM невідомі сторінки»).

    Асистент використовує API інших сервісів: collector (вибірка), registry (пошук, форк,
    публікація пакетів), handler-runtime (тести), llm (запити й бюджет), orchestrator (лише щоб
    застосувати обраний варіант, якщо користувач дозволив автоактивацію). Усі тривалі операції —
    202 + Job. Вміст джерел — дані, не інструкції. Створені версії проходять тести й політику
    погодження; користувач обирає варіант, якщо не дозволив автоактивацію.
  license:
    name: Proprietary
    identifier: LicenseRef-Jane
servers:
  - url: http://localhost:8111
    description: assistant (dev)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: onboarding
  - name: improvement
  - name: unknown
  - name: jobs
paths:
  /v1/health:
    $ref: 'common.yaml#/components/pathItems/Health'
  /v1/info:
    $ref: 'common.yaml#/components/pathItems/Info'
  /v1/onboarding-sessions:
    get:
      x-jane-scope: assistant:use
      operationId: listOnboardingSessions
      summary: Сесії підключення, новіші першими (відновлення стану адмінки після перезавантаження)
      description: |
        Курсорна пагінація (`limit`, `cursor` → `next_cursor`, `null` — сторінок більше немає). Порядок —
        `created_at` спадно, за рівності — `session_id` спадно; курсор стабільний, поки сесії додаються.
        Елементи — короткий стан сесії; повний (кандидати, вибірка, аналіз, варіанти) —
        `GET /v1/onboarding-sessions/{session_id}`. Сесії без змін довше за налаштований строк зберігання
        асистента (`state.session_retention_seconds`) видаляються.
      tags: [onboarding]
      parameters:
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: Лише сесії в цих станах (параметр можна повторити, наприклад `?status=sampling&status=analyzing`).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OnboardingStatus'
      responses:
        '200':
          description: Сторінка сесій.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSessionList'
              examples:
                page:
                  value:
                    items:
                      - session_id: onb_01J9ZY0000000000000000002
                        status: insufficient_sample
                        query: https://tiny.example.test/
                        proposal_count: 0
                        costs:
                          amount: 0.05
                          currency: USD
                        job_id: job_01J9ZY0000000000000000JO2
                        created_at: '2026-09-27T10:00:00Z'
                      - session_id: onb_01J9ZY0000000000000000001
                        status: proposals_ready
                        query: Shop Example kettles
                        selected_candidate_id: cand_1
                        proposal_count: 2
                        costs:
                          amount: 0.31
                          currency: USD
                        job_id: job_01J9ZY0000000000000000JOB
                        created_at: '2026-09-27T09:00:00Z'
                    next_cursor: WyIyMDI2LTA5LTI3VDA5OjAwOjAwWiIsIm9uYl8wMUo5WlkwMDAwMDAwMDAwMDAwMDAwMDAxIl0
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
    post:
      x-jane-scope: assistant:use
      operationId: startOnboarding
      summary: Почати підключення джерела (назва сайту/каналу або точне посилання)
      description: |
        202 + Job (`kind: onboarding`). Ідентифікатор створеної сесії — `Job.labels.session_id`, її адреса —
        `Job.links.session` (`/v1/onboarding-sessions/{session_id}`); ті самі поля мають усі job сесії
        (продовження після `selectCandidate`, `acceptProposal`). `Job.result` завершеного job — `OnboardingSession`
        на момент завершення (зокрема `needs_disambiguation`, `proposals_ready`, `insufficient_sample`).
      tags: [onboarding]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
            examples:
              byName:
                value:
                  query: Shop Example kettles
                  expected_entity_types: [product]
                  limits:
                    budget:
                      amount: 2
                      currency: USD
                      period: total
                    max_onboarding_samples: 60
                  auto_activation: false
              byUrl:
                value:
                  query: https://news.example.test/
                  source_kind: web
                  expected_entity_types: [event]
                  crawl_hints:
                    scope:
                      allowed_domains: [news.example.test]
      responses:
        '202':
          description: Підключення почато; `labels.session_id` і `links.session` — сесія.
          headers:
            Location:
              $ref: 'common.yaml#/components/headers/Location'
            Idempotency-Replayed:
              $ref: 'common.yaml#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Job'
              examples:
                queued:
                  $ref: 'common.yaml#/components/examples/JobQueued'
                onboarding:
                  $ref: '#/components/examples/JobOnboardingQueued'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
  /v1/onboarding-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      x-jane-scope: assistant:use
      operationId: getOnboardingSession
      summary: Стан підключення — кандидати, вибірка, аналіз, варіанти
      tags: [onboarding]
      responses:
        '200':
          description: Сесія.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSession'
              examples:
                ambiguous:
                  $ref: '#/components/examples/SessionAmbiguous'
                proposals:
                  $ref: '#/components/examples/SessionProposals'
                insufficient:
                  $ref: '#/components/examples/SessionInsufficient'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
  /v1/onboarding-sessions/{session_id}/candidate-selection:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      x-jane-scope: assistant:use
      operationId: selectCandidate
      summary: Уточнити неоднозначність — обрати джерело з кандидатів
      tags: [onboarding]
      x-jane-no-idempotency-key: selecting the same candidate again yields the same state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_id]
              properties:
                candidate_id:
                  type: string
            examples:
              select:
                value:
                  candidate_id: cand_1
      responses:
        '200':
          description: Вибір прийнято; сесія продовжується (sampling).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSession'
              examples:
                sampling:
                  value:
                    session_id: onb_01J9ZY0000000000000000001
                    status: sampling
                    query: Shop Example kettles
                    selected_candidate_id: cand_1
                    job_id: job_01J9ZY0000000000000000JOB
                    created_at: '2026-09-27T09:00:00Z'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
  /v1/onboarding-sessions/{session_id}/proposals/{proposal_id}/acceptance:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
    post:
      x-jane-scope: assistant:use
      operationId: acceptProposal
      summary: Прийняти варіант — опублікувати правила й пакети, прогнати тести, підготувати джерело й завдання
      description: |
        Результат job — AcceptanceResult: опубліковані версії (draft або approved за політикою),
        звіти тестів, чернетки Source і TaskConfig. Якщо `activate: true` і політика дозволяє —
        асистент створює джерело й завдання в оркестраторі; інакше їх створює користувач з адмінки.
      tags: [onboarding]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                activate:
                  type: boolean
                  default: false
                source_id:
                  $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
            examples:
              accept:
                value:
                  activate: false
                  source_id: shop-example
      responses:
        '202':
          $ref: 'common.yaml#/components/responses/JobAccepted'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
  /v1/improvement-runs:
    get:
      x-jane-scope: assistant:use
      operationId: listImprovementRuns
      summary: Запуски вдосконалення (job `kind = improvement`), новіші першими
      description: |
        Job, створені `startImprovement`, з `result` = `ImprovementResult` для завершених — щоб адмінка відновила
        список після перезавантаження. Курсорна пагінація (`limit`, `cursor` → `next_cursor`); порядок —
        `created_at` спадно, за рівності — `job_id` спадно. Фільтри — за мітками job (`labels.package_id`,
        `labels.source_id`, `labels.problem_group_id`) і станом. Завершені job зберігаються
        `limits.transfer.job_retention_seconds` асистента.
      tags: [improvement]
      parameters:
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
        - name: package_id
          in: query
          required: false
          schema:
            type: string
        - name: source_id
          in: query
          required: false
          schema:
            type: string
        - name: problem_group_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Лише job у цих станах (параметр можна повторити).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '../schemas/common/job.schema.json#/$defs/JobStatus'
      responses:
        '200':
          description: Сторінка job вдосконалення.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/JobList'
              examples:
                page:
                  value:
                    items:
                      - job_id: job_01J9ZW00000000000000IMPROV
                        kind: improvement
                        status: succeeded
                        created_at: '2026-09-27T10:00:00Z'
                        finished_at: '2026-09-27T10:01:30Z'
                        labels:
                          package_id: shop-example.product-extractor
                          source_id: shop-example
                          problem_group_id: pg_01J9ZW0000000000000000001
                        links:
                          self: /v1/jobs/job_01J9ZW00000000000000IMPROV
                          cancel: /v1/jobs/job_01J9ZW00000000000000IMPROV/cancel
                        result:
                          outcome: new_version
                          version:
                            package_id: shop-example.product-extractor
                            version: 1.2.1
                          attempts: 1
                          activated: false
                    next_cursor: null
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
    post:
      x-jane-scope: assistant:use
      operationId: startImprovement
      summary: Вдосконалити екстрактор на проблемних прикладах (нова версія або форк)
      description: |
        LLM отримує вибірку проблем, поточний код, діагностику й успішні приклади. Нова версія
        проходить нові й попередні тести й перевіряється на всіх прив'язках спільного пакета
        (або оформлюється форком). Кількість спроб і витрати обмежені `limits.llm`. Якщо пакет
        заборонено змінювати автоматично — лише пропозиція без публікації. Результат —
        `Job.result` = ImprovementResult.
      tags: [improvement]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImprovementRequest'
            examples:
              improve:
                value:
                  package:
                    package_id: shop-example.product-extractor
                    version: 1.2.0
                  source_id: shop-example
                  problem_group_id: pg_01J9ZW0000000000000000001
                  problem_samples:
                    - material_ref:
                        storage_connection_id: raw-files
                        object_id: obj_01J9ZQ4C00000000000000D9
                      diagnostics:
                        - level: warning
                          code: extract.missing_selector
                          message: selector .price matched 0 elements
                  successful_examples:
                    - material_ref:
                        storage_connection_id: raw-files
                        object_id: obj_01J9ZQ4C00000000000000D1
                  bindings:
                    - task_id: shop-catalog
                      stage_id: extract-products
                    - task_id: shop-price-check
                      stage_id: extract-price
                  policy:
                    approval: manual
                    allow_fork: true
                  limits:
                    max_improvement_attempts: 3
                    budget:
                      amount: 1
                      currency: USD
                      period: run
      responses:
        '202':
          $ref: 'common.yaml#/components/responses/JobAccepted'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
  /v1/unknown-materials:
    post:
      x-jane-scope: assistant:use
      operationId: analyzeUnknownMaterial
      summary: Проаналізувати невідомий матеріал (викликає оркестратор лише за увімкненим прапорцем)
      tags: [unknown]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnknownMaterialRequest'
            examples:
              unknown:
                value:
                  source_id: shop-example
                  task_id: shop-catalog
                  forward_unknown_to_llm: true
                  material:
                    material_id: web:0a1b2c3d4e5f60718293a4b5c6d7e8f9
                    observation_id: obs_01J9ZQ5A0000000000000007
                    source:
                      source_id: shop-example
                      kind: web
                    locator:
                      url: https://shop.example.test/gift-cards
                    fetched_at: '2026-09-27T10:05:00Z'
                    format:
                      media_type: text/html
                    revision:
                      content_sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    content:
                      kind: inline
                      media_type: text/html
                      encoding: utf-8
                      data: '<html><h1>Gift cards</h1></html>'
                    collector:
                      name: web-collector
                      version: 0.1.0
      responses:
        '202':
          $ref: 'common.yaml#/components/responses/JobAccepted'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '403':
          description: forward_unknown_to_llm не увімкнено — асистент не викликає LLM (`access_denied_by_policy`).
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                flagOff:
                  value:
                    type: urn:jane:problem:access_denied_by_policy
                    title: Forwarding unknown pages to LLM is disabled
                    status: 403
                    code: access_denied_by_policy
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
  /v1/jobs/{job_id}:
    parameters:
      - $ref: 'common.yaml#/components/parameters/JobId'
    get:
      x-jane-scope: assistant:use
      operationId: getJob
      summary: Стан, прогрес і результат тривалої операції
      description: |
        `Job.result` завершеного (`succeeded`) job за `kind`: `onboarding` — `OnboardingSession`;
        `onboarding_acceptance` — `AcceptanceResult`; `improvement` — `ImprovementResult`;
        `unknown_material` — `UnknownMaterialResult`. Job сесії підключення мають `labels.session_id` і `links.session`.
      tags: [jobs]
      responses:
        '200':
          description: Поточний стан job.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Job'
              examples:
                running:
                  $ref: 'common.yaml#/components/examples/JobRunning'
                failed:
                  $ref: 'common.yaml#/components/examples/JobFailed'
                onboardingSucceeded:
                  $ref: '#/components/examples/JobOnboardingSucceeded'
                acceptanceSucceeded:
                  $ref: '#/components/examples/JobAcceptanceSucceeded'
                improvementSucceeded:
                  $ref: '#/components/examples/JobImprovementSucceeded'
                improvementProposalOnly:
                  $ref: '#/components/examples/JobImprovementProposalOnly'
                unknownSucceeded:
                  $ref: '#/components/examples/JobUnknownSucceeded'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
  /v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: 'common.yaml#/components/parameters/JobId'
    post:
      x-jane-scope: assistant:use
      operationId: cancelJob
      summary: Запит на скасування job (ідемпотентний)
      x-jane-no-idempotency-key: cancellation is idempotent by nature
      description: |
        202 — скасування прийнято, job переходить у `cancelling`, далі в `cancelled`.
        200 — job уже в термінальному стані; повертається як є, без змін.
        Повторний виклик безпечний, тому Idempotency-Key не потрібен.
      tags: [jobs]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'common.yaml#/components/schemas/JobCancelRequest'
            examples:
              reason:
                value:
                  reason: wrong scope
      responses:
        '200':
          description: Job уже завершено; стан не змінено.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Job'
              examples:
                failed:
                  $ref: 'common.yaml#/components/examples/JobFailed'
        '202':
          description: Скасування прийнято.
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Job'
              examples:
                cancelling:
                  $ref: 'common.yaml#/components/examples/JobCancelling'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/defs.schema.json#/$defs/Id'
  schemas:
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: Назва сайту чи каналу або точне посилання.
        source_kind:
          $ref: '../schemas/common/defs.schema.json#/$defs/SourceKind'
        expected_entity_types:
          type: array
          items:
            type: string
        crawl_hints:
          type: object
          description: Часткові правила обходу від користувача (фрагмент CollectorRules), які асистент має врахувати.
        limits:
          $ref: '../schemas/common/limits.schema.json#/properties/llm'
        auto_activation:
          type: boolean
          default: false
    SourceCandidate:
      type: object
      required: [candidate_id, title]
      properties:
        candidate_id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        telegram_username:
          type: string
        description:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    FieldInfo:
      type: object
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
        examples:
          type: array
          items: {}
        coverage:
          type: number
          minimum: 0
          maximum: 1
    SourceAnalysis:
      type: object
      properties:
        source_kind:
          type: string
        discovery_methods:
          type: array
          items:
            type: string
          description: Доступні способи обходу (sitemap, feed, listing, api_feed, recursive…).
        material_types:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type:
                type: string
              count:
                type: integer
              example_urls:
                type: array
                items:
                  type: string
        entities:
          type: array
          items:
            type: object
            required: [entity_type, fields]
            properties:
              entity_type:
                type: string
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/FieldInfo'
    ExtractorPlan:
      type: object
      required: [entity_type, action]
      properties:
        entity_type:
          type: string
        action:
          type: string
