openapi: 3.1.0
info:
  title: Jane Orchestrator API
  version: 1.0.0
  description: |
    Керування оркестратором (WP-09) — споживач: адмінка (WP-12), асистент (WP-11), сторонні
    застосунки. Оркестратор поєднує автономні сервіси через їхні API (collector, handler, storage,
    registry, llm) і нічого не читає з їхніх БД. Автономні компоненти від оркестратора не залежать.

    - Джерела, завдання (TaskConfig), розклади — ресурси з ETag; зміни — PUT з If-Match.
    - Запуск завдання — 202 + Job (`kind: run`), деталі — `/v1/runs/{run_id}` (run_id = job_id).
    - Простежуваність: матеріал → етап → результат → версія пакета (`/v1/materials/{id}/trace`).
    - Реєстр підключень зберігає лише посилання на секрети й синхронізує підключення з
      виконавцями (`PUT /v1/connections/{id}` handler.v1).
    - Активація й відкат версії пакета в етапі — окремі операції з аудитом.
  license:
    name: Proprietary
    identifier: LicenseRef-Jane
servers:
  - url: http://localhost:8109
    description: orchestrator (dev)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: sources
  - name: tasks
  - name: runs
  - name: traces
  - name: problems
  - name: connections
  - name: limits
  - name: audit
  - name: jobs
paths:
  /v1/health:
    $ref: 'common.yaml#/components/pathItems/Health'
  /v1/info:
    $ref: 'common.yaml#/components/pathItems/Info'
  /v1/sources:
    get:
      operationId: listSources
      summary: Джерела
      tags: [sources]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка джерел.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '../schemas/source.schema.json'
                  next_cursor:
                    $ref: '../schemas/common/page.schema.json#/$defs/NextCursor'
              examples:
                list:
                  value:
                    items:
                      - source_id: shop-example
                        kind: web
                        title: Shop Example
                        locator:
                          url: https://shop.example.test/
                        forward_unknown_to_llm: false
                    next_cursor: null
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
    post:
      operationId: createSource
      summary: Створити джерело
      tags: [sources]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/source.schema.json'
            examples:
              shop:
                $ref: '../examples/openapi/source-shop.json'
              telegram:
                $ref: '../examples/openapi/source-telegram.json'
      responses:
        '201':
          description: Джерело створено.
          headers:
            Location:
              $ref: 'common.yaml#/components/headers/Location'
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/source.schema.json'
              examples:
                shop:
                  $ref: '../examples/openapi/source-shop.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
  /v1/sources/{source_id}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      operationId: getSource
      summary: Джерело
      tags: [sources]
      responses:
        '200':
          description: Джерело.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/source.schema.json'
              examples:
                shop:
                  $ref: '../examples/openapi/source-shop.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
    put:
      operationId: replaceSource
      summary: Замінити джерело (включно з прапорцем «Передавати в LLM невідомі сторінки»)
      tags: [sources]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/source.schema.json'
            examples:
              telegram:
                $ref: '../examples/openapi/source-telegram.json'
      responses:
        '200':
          description: Джерело оновлено.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/source.schema.json'
              examples:
                telegram:
                  $ref: '../examples/openapi/source-telegram.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteSource
      summary: Видалити джерело (заборонено, якщо є завдання)
      tags: [sources]
      responses:
        '204':
          description: Видалено.
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: Завдання (з фільтром за джерелом або пакетом, що використовується в етапах)
      description: |
        `package_id` — лише завдання, у яких хоча б один етап (або правила колектора) посилається на
        цей пакет; разом із `package_version` — на цю точну версію. Так адмінка й асистент знаходять
        усі прив'язки спільного пакета (ТЗ §9: перевірка на всіх прив'язках). У відповіді
        `package_stages` перелічує такі етапи.
      tags: [tasks]
      parameters:
        - name: source_id
          in: query
          required: false
          schema:
            type: string
        - name: package_id
          in: query
          required: false
          schema:
            $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
        - name: package_version
          in: query
          required: false
          description: Лише разом із package_id.
          schema:
            $ref: '../schemas/common/defs.schema.json#/$defs/SemVer'
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка завдань.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskSummary'
                  next_cursor:
                    $ref: '../schemas/common/page.schema.json#/$defs/NextCursor'
              examples:
                byPackage:
                  summary: ?package_id=shop-example.product-extractor
                  value:
                    items:
                      - task_id: shop-catalog
                        title: Повний збір каталогу Shop Example
                        source_id: shop-example
                        enabled: true
                        package_stages:
                          - stage_id: extract-products
                            package:
                              package_id: shop-example.product-extractor
                              version: 1.2.0
                    next_cursor: null
                list:
                  value:
                    items:
                      - task_id: shop-catalog
                        title: Повний збір каталогу Shop Example
                        source_id: shop-example
                        enabled: true
                        schedule:
                          type: cron
                          cron: 0 2 * * 0
                          timezone: Europe/Kyiv
                        next_run_at: '2026-10-04T02:00:00+03:00'
                        last_run:
                          run_id: run_01J9ZQ3F8W2N4K7T5B6C1D0E9F
                          status: succeeded
                          finished_at: '2026-09-27T11:40:00Z'
                      - task_id: shop-price-check
                        title: Щоденна перевірка цін
                        source_id: shop-example
                        enabled: true
                        schedule:
                          type: interval
                          interval_seconds: 86400
                    next_cursor: null
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
    post:
      operationId: createTask
      summary: Створити завдання
      tags: [tasks]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/task-config.schema.json'
            examples:
              catalog:
                $ref: '../examples/openapi/task-catalog.json'
              priceCheck:
                $ref: '../examples/openapi/task-price-check.json'
              telegram:
                $ref: '../examples/openapi/task-telegram.json'
      responses:
        '201':
          description: Завдання створено.
          headers:
            Location:
              $ref: 'common.yaml#/components/headers/Location'
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/task-config.schema.json'
              examples:
                catalog:
                  $ref: '../examples/openapi/task-catalog.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
  /v1/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTask
      summary: Конфігурація завдання
      tags: [tasks]
      responses:
        '200':
          description: Завдання.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/task-config.schema.json'
              examples:
                catalog:
                  $ref: '../examples/openapi/task-catalog.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
    put:
      operationId: replaceTask
      summary: Замінити конфігурацію завдання (ліміти, розклад, етапи) без зміни коду
      tags: [tasks]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/task-config.schema.json'
            examples:
              priceCheck:
                $ref: '../examples/openapi/task-price-check.json'
      responses:
        '200':
          description: Завдання оновлено; поточні запуски продовжуються зі старою конфігурацією.
          headers:
            ETag:
              $ref: 'common.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../schemas/task-config.schema.json'
              examples:
                priceCheck:
                  $ref: '../examples/openapi/task-price-check.json'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '412':
          $ref: 'common.yaml#/components/responses/PreconditionFailed'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteTask
      summary: Видалити завдання (історія запусків зберігається)
      tags: [tasks]
      responses:
        '204':
          description: Видалено.
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
  /v1/task-validations:
    post:
      operationId: validateTask
      summary: Перевірити конфігурацію завдання без збереження (DAG, версії, прив'язки, ліміти)
      tags: [tasks]
      x-jane-no-idempotency-key: pure validation without side effects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/task-config.schema.json'
            examples:
              catalog:
                $ref: '../examples/openapi/task-catalog.json'
      responses:
        '200':
          description: Результат перевірки (невалідна конфігурація — теж 200 з valid=false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskValidation'
              examples:
                warnings:
                  value:
                    valid: true
                    errors: []
                    warnings:
                      - pointer: /stages/5
                        code: unknown_flag_off
                        message: stage 'unknown-pages' consumes unmatched_materials but forward_unknown_to_llm is false; materials will only be registered
                    effective_forward_unknown_to_llm: false
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
  /v1/tasks/{task_id}/runs:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      operationId: startRun
      summary: Запустити завдання зараз
      tags: [runs]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            examples:
              manual:
                value:
                  reason: manual check after rules update
              testMode:
                value:
                  reason: dry run of new extractor version
                  test_mode: true
                  input_override:
                    urls:
                      - https://shop.example.test/product/a-100
      responses:
        '202':
          $ref: 'common.yaml#/components/responses/JobAccepted'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          description: Запуск уже йде, а schedule.overlap = skip (`conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                overlap:
                  value:
                    type: urn:jane:problem:conflict
                    title: A run of this task is already in progress
                    status: 409
                    code: conflict
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
  /v1/tasks/{task_id}/stages/{stage_id}/activations:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: stage_id
        in: path
        required: true
        schema:
          $ref: '../schemas/common/defs.schema.json#/$defs/Slug'
    get:
      operationId: listStageActivations
      summary: Історія версій пакета в етапі (активації й відкати)
      tags: [tasks, audit]
      parameters:
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка активацій (від новіших).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activation'
                  next_cursor:
                    $ref: '../schemas/common/page.schema.json#/$defs/NextCursor'
              examples:
                history:
                  value:
                    items:
                      - activation_id: act_01J9ZV0000000000000000002
                        task_id: shop-catalog
                        stage_id: extract-products
                        package:
                          package_id: shop-example.product-extractor
                          version: 1.1.0
                        previous:
                          package_id: shop-example.product-extractor
                          version: 1.2.0
                        kind: rollback
                        reason: regression on category pages
                        activated_by: admin@example.org
                        activated_at: '2026-09-27T12:00:00Z'
                    next_cursor: null
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
    post:
      operationId: activateStageVersion
      summary: Активувати версію пакета в етапі (або відкотити до попередньої)
      description: |
        Змінює `stages[].handler` завдання з аудитом.
        - `activate` — людина активує версію; версія має бути `approved` у репозиторії.
        - `rollback` — повернення до попередньої активації (або до вказаної версії).
        - `auto_activate` — автоматична активація (асистент після перевірок). Приймається лише якщо
          політика дозволяє: `Source.change_policy.llm_versions = auto_after_checks` **і** пакет
          має `auto_changes_allowed = true` **і** версія пройшла тести (`test_status = passed`) на
          всіх прив'язках. Інакше — 403 `access_denied_by_policy` (у `details.reason`:
          `source_policy`, `package_auto_changes_forbidden` або `tests_not_passed`), активація не
          виконується.
      tags: [tasks]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
            examples:
              activate:
                value:
                  kind: activate
                  package:
                    package_id: shop-example.product-extractor
                    version: 1.2.0
                    digest: sha256:0f4c1c8f3e0f6a7d9b2c4e6f8a0b2c4d6e8f0a1b3c5d7e9f1a3b5c7d9e1f3a5b
                  reason: tests passed on all bindings
              rollback:
                value:
                  kind: rollback
                  reason: regression on category pages
              autoActivate:
                value:
                  kind: auto_activate
                  package:
                    package_id: shop-example.product-extractor
                    version: 1.3.0
                  reason: assistant improvement job_01J9ZX0000000000000000IMP passed tests on 2 bindings
      responses:
        '200':
          description: Активацію виконано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
              examples:
                activated:
                  value:
                    activation_id: act_01J9ZV0000000000000000001
                    task_id: shop-catalog
                    stage_id: extract-products
                    package:
                      package_id: shop-example.product-extractor
                      version: 1.2.0
                    previous:
                      package_id: shop-example.product-extractor
                      version: 1.1.0
                    kind: activate
                    reason: tests passed on all bindings
                    activated_by: admin@example.org
                    activated_at: '2026-09-27T10:20:00Z'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '403':
          description: Автоактивацію заборонено політикою (`access_denied_by_policy`) або бракує scope (`forbidden`).
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common/problem.schema.json'
              examples:
                policy:
                  value:
                    type: urn:jane:problem:access_denied_by_policy
                    title: Automatic activation is not allowed
                    status: 403
                    code: access_denied_by_policy
                    retryable: false
                    details:
                      reason: package_auto_changes_forbidden
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
  /v1/runs:
    get:
      operationId: listRuns
      summary: Запуски
      tags: [runs]
      parameters:
        - name: task_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '../schemas/common/job.schema.json#/$defs/JobStatus'
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: 'common.yaml#/components/parameters/Cursor'
        - $ref: 'common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Сторінка запусків.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
                  next_cursor:
                    $ref: '../schemas/common/page.schema.json#/$defs/NextCursor'
              examples:
                list:
                  value:
                    items:
                      - run_id: run_01J9ZQ3F8W2N4K7T5B6C1D0E9F
                        task_id: shop-catalog
                        status: running
                        trigger: schedule
                        created_at: '2026-09-27T10:00:00Z'
                    next_cursor: null
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
  /v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      summary: Стан запуску, прогрес етапів, витрати
      tags: [runs]
      responses:
        '200':
          description: Запуск.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                running:
                  $ref: '#/components/examples/RunRunning'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthenticated'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
  /v1/runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      summary: Скасувати запуск (те саме, що /v1/jobs/{run_id}/cancel)
      tags: [runs]
      x-jane-no-idempotency-key: cancellation is idempotent by nature
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '../schemas/common/job.schema.json#/$defs/JobCancelRequest'
            examples:
              reason:
                value:
                  reason: wrong limits
      responses:
        '200':
          description: Запуск уже завершено; стан не змінено.
          content:
            application/json:
              schema:
                $ref: '../schemas/common/job.schema.json'
              examples:
                done:
                  value:
                    job_id: run_01J9ZQ3F8W2N4K7T5B6C1D0E9F
                    kind: run
                    status: succeeded
