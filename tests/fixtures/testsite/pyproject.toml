[project]
name = "jane-testsite"
version = "0.1.0"
description = "Deterministic test website for Jane collector and discovery tests (stdlib only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jane-testsite = "jane_testsite.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_testsite"]
