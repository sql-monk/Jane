[project]
name = "jane-kit"
version = "0.1.0"
description = "Shared building blocks for Jane services: config with inherited limits, logging, metrics, health, errors, idempotency, async jobs, contract helpers and client generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "PyYAML>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
jane-codegen = "jane_kit.codegen:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jane_kit"]
